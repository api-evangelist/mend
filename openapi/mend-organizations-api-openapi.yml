        findings:
          type: array
          items:
            $ref: '#/components/schemas/DiffUnifiedFindingDTOV3'
    DWRResponseV3SecurityFindingsSummaryResponseDTO:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
        response:
          $ref: '#/components/schemas/SecurityFindingsSummaryResponseDTO'
    ProjectViolationIdentifierDTOV3:
      type: object
      properties:
        findingUuid:
          type: string
        originUuid:
          type: string
        projectUuid:
          type: string
    ScanDiffStatsDTOV3:
      type: object
      properties:
        added:
          type: integer
