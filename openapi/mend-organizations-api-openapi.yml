          type: string
        type:
          type: string
        severity:
          type: string
        score:
          type: number
          format: float
        element:
          type: string
        elementId:
          type: string
        refId:
          type: string
        grouping:
          type: string
        status:
          type: string
        state:
          type: string
        suppressMetadata:
          $ref: '#/components/schemas/SuppressMetadataDTO'
        paths:
          type: array
          items:
            type: string
        sources:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        dynamicFields:
          type: object
          additionalProperties:
            type: object
        riskFactors:
          type: array
          items:
            type: string
        riskFactorsJson:
          type: object
          additionalProperties:
            type: object
        engine:
          type: string
          enum:
          - UNIFIED
          - SCA
          - SAST
          - IAC
          - IMG
          - AI
          - DAST
        vendor:
          type: string
        orgUuid:
          type: string
        projectUuid:
          type: string
        projectName:
          type: string
        branch:
          type: string
        scanUuid:
          type: string
        firstScanUuid:
          type: string
        findingCategory:
          type: string
        hasViolation:
          type: boolean
        numberOfViolations:
          type: integer
          format: int32
        violationWorkflowUuids:
          type: array
          items:
            type: string
        applicationUuid:
          type: string
        applicationName:
          type: string
        isNew:
          type: boolean
        isDetectedAtFirstScan:
          type: boolean
        isRemediationAvailable:
          type: boolean
    SuppressMetadataDTO:
      type: object
      properties:
        reason:
          type: string
        comment:
          type: string
        userEmail:
          type: string
        userUuid:
          type: string
        updatedAt:
          type: string
    ScaSummaryDTO:
      type: object
      properties:
        total:
          type: integer
          format: int32
        critical:
          type: integer
          format: int32
        high:
          type: integer
          format: int32
        medium:
          type: integer
          format: int32
        low:
          type: integer
          format: int32
