        workflowName:
          type: string
        entityUuid:
          type: string
    ScanDiffRequestDTOV3:
      required:
      - type
      type: object
      properties:
        source:
          $ref: '#/components/schemas/ScanInputDTOV3'
        target:
          $ref: '#/components/schemas/ScanInputDTOV3'
        type:
          title: type
          type: string
          description: One of { security, legal, library, ai_inventory }
  securitySchemes:
    bearer-key:
      type: http
      description: JWT token Bearer
      scheme: bearer
      bearerFormat: JWT
