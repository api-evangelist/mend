components:
  schemas:
    ConfigurationDTO:
      type: object
      properties:
        uuid:
          type: string
        namespace:
          type: string
        value:
          type: string
        displayName:
          type: string
        contextType:
          type: string
    DWRResponseBase:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
    MessageDTO:
      type: object
      properties:
        message:
          title: message
          type: string
          example: Success!
  securitySchemes:
    bearer-key:
      type: http
      description: JWT token Bearer
      scheme: bearer
      bearerFormat: JWT
