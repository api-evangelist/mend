  /api/v3.0/orgs/{orgUuid}/applications/summaries/totals:
    get:
      tags:
      - Applications
      summary: Get Application totals
      description: Returns the requested statistics for the given applications
      operationId: getApplicationsTotals
      parameters:
      - name: fromDate
        in: query
        description: Enter the start date for the search. The date format is yyyy-MM-dd
        required: true
        schema:
          type: string
      - name: toDate
        in: query
        description: Enter the end date for the search. The date format is yyyy-MM-dd
        required: true
        schema:
          type: string
      - name: search
        in: query
        description: "Filter your search to return items whose property has a specific value.\nUse the syntax: **[property][operator][value]**\n+ **Property**: the name of the property of the item\n+ **Operator**:\n    + **equals (==)** - Returns true if the value exactly matches this one. If the value contains a * character, it behaves like a wildcard (similar to the LIKE operator).\nExample: entity==abc* — will return true for entities like \"abcd\" and \"abc_123\".\n    + **in (=in=)** - Returns true if the value matches any item in the comma-separated list.\nExample: entity=in=value1,value2 — will return true for entities which are either value1, or value2.\n    + **between (=btw=)** - Returns true if the value falls within the specified range.\nExample: entity=btw=10,20 — will return true for values between 10 and 20.\n\n+ **Value**: the value of the property.\n\nLogical operators AND (;) and OR (,) are supported in filters — param1=in=(val1,val2) and (param2==val3 or param3==val4), can also be written as — param1=in=(val1,val2);(param2==val3,param3==val4)\n\nThis endpoint supports filtering on the following properties and its supported operators:\n+ labelUuid: UUID Values: equals, in\n+ applicationUuid: UUID Values: equals, in\n+ projectUuid: UUID Values: equals, in\n+ engines: UUID Values: equals, in"
        allowEmptyValue: true
        schema:
          type: string
      - name: orgUuid
        in: path
        description: Org UUID (Administration > General)
        required: true
        schema:
          type: string
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DWRResponseV3PeriodTotalsDTO'
