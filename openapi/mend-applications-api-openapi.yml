        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DWRResponseV3MessageDTO'
  /api/v3.0/orgs/{orgUuid}/applications/summaries:
    post:
      tags:
      - Applications
      summary: Get Application Statistics
      description: Returns the requested statistics for the given applications
      operationId: getApplicationSummaries
      parameters:
      - name: cursor
        in: query
        description: Parameter indicates the starting point for retrieving results, the first call doesn't include a cursor parameter in the request, the API response includes the first set of results along with a cursor pointing to the last item retrieved
        allowEmptyValue: true
        schema:
          type: string
          default: '0'
      - name: limit
        in: query
        description: Specifies the maximum number of items to be return in the response.
        allowEmptyValue: true
        schema:
          maximum: 10000
          type: string
          default: '50'
      - name: search
        in: query
        description: "Filter your search to return items whose property has a specific value.\nUse the syntax: **[property][operator][value]**\n+ **Property**: the name of the property of the item\n+ **Operator**:\n    + **equals (==)** - Returns true if the value exactly matches this one. If the value contains a * character, it behaves like a wildcard (similar to the LIKE operator).\nExample: entity==abc* — will return true for entities like \"abcd\" and \"abc_123\".\n    + **in (=in=)** - Returns true if the value matches any item in the comma-separated list.\nExample: entity=in=value1,value2 — will return true for entities which are either value1, or value2.\n    + **between (=btw=)** - Returns true if the value falls within the specified range.\nExample: entity=btw=10,20 — will return true for values between 10 and 20.\n    + **greaterThan (=gt=)** - Returns true if the value is greater than the specified parameter.\nExample: entity=gt=100 — will return true for values greater than 100.\n+ **Value**: the value of the property.\nLogical operators AND (;) and OR (,) are supported in filters — param1=in=(val1,val2) and (param2==val3 or param3==val4), can also be written as — param1=in=(val1,val2);(param2==val3,param3==val4)\n\nThis endpoint supports filtering on the following properties and its supported operators:\n\n+ project: equals\n+ product: equals\n+ tags: equals, in\n+ labels: equals, in\n+ labelNamespace: equals, in\n+ productLabels: equals, in\n+ created: between\n+ totalLibraries: gt\n+ vulnerableLibraries: gt\n+ criticalSeverityLibraries: gt\n+ highSeverityVulnerabilities: gt\n+ mediumSeverityVulnerabilities: gt\n+ lowSeverityVulnerabilities: gt\n+ highSeverityLibraries: gt\n+ mediumSeverityLibraries: gt\n+ lowSeverityLibraries: gt\n+ totalVulnerabilities: gt\n+ outdatedLibraries: gt\n+ policyViolations: gt\n+ licenseRisk: gt\n+ highRiskLicenses: gt\n+ mediumRiskLicenses: gt\n+ lowRiskLicenses: gt\n+ libraryTypes: equals, in\n+ sastVulnerabilities: gt\n+ sastHighVulnerabilities: gt\n+ sastMediumVulnerabilities: gt\n+ sastVulnerabilityTypes: equals, in\n+ sastTestedFiles: gt\n+ sastTestedLines: gt\n+ sastTotalFiles: gt\n+ sastTotalLines: gt\n+ sastTotalMended: gt\n+ sastTotalRemediations: gt\n+ llmTotalLines: gt\n+ unifiedVulnerabilities: gt\n+ unifiedHighVulnerabilities: gt\n+ unifiedMediumVulnerabilities: gt\n+ unifiedLowVulnerabilities: gt\n+ unifiedCriticalVulnerabilities: gt\n+ lastScanTime: gt\n+ lastScaScanTime: gt\n+ lastSastScanTime: gt\n+ imgTotalVulnerabilities: gt\n+ imgCriticalVulnerabilities: gt\n+ imgHighVulnerabilities: gt\n+ imgMediumVulnerabilities: gt\n+ imgLowVulnerabilities: gt\n+ dastTotalVulnerabilities: gt\n+ dastCriticalVulnerabilities: gt\n+ dastHighVulnerabilities: gt\n+ dastMediumVulnerabilities: gt\n+ dastLowVulnerabilities: gt\n+ aiTotalVulnerabilities: gt\n+ aiCriticalVulnerabilities: gt\n+ aiHighVulnerabilities: gt\n+ aiMediumVulnerabilities: gt\n+ aiLowVulnerabilities: gt\n+ iacTotalMisconfigurations: gt\n+ iacCriticalSeverityMisconfigurations: gt\n+ iacHighSeverityMisconfigurations: gt\n+ iacMediumSeverityMisconfigurations: gt\n+ iacLowSeverityMisconfigurations: gt\n+ scaCriticalSecurityEventFindings: true/false (has any critical security event findings) or an event name such as 'Log4Shell' (has findings for that specific event). equals, in\n"
        allowEmptyValue: true
        schema:
          type: string
      - name: orgUuid
        in: path
        description: Org UUID (Administration > General)
        required: true
        schema:
          type: string
      - name: categories
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MultiContextRequestDTOV3'
        required: true
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DWRResponsePageableV3ListApplicationSummaryDTOV3'
