      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequestDTOV3'
        required: true
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DWRResponseV3ApplicationDTOV3'
  /api/v3.0/applications/{applicationUuid}/container/projects/importSbom:
    post:
      tags:
      - Applications
      summary: Import a container SBOM and create a new project (Cloud Native)
      description: Creates a new project under the application (or returns the existing one) and imports the uploaded container SBOM (CycloneDX JSON or SPDX JSON/tag-value). The scan is queued for asynchronous processing by the cloud-native engine.
      operationId: createProjectWithContainerSbom
      parameters:
      - name: applicationUuid
        in: path
        description: Application UUID (Administration > Applications)
        required: true
        schema:
          type: string
      - name: imageName
        in: query
        description: Optional image name recorded on the scan (e.g. alpine:3.19).
        required: false
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - projectName
              - sbomFile
              type: object
              properties:
                projectName:
                  type: string
                  description: Name of the project to create under this application
                projectDescription:
                  type: string
                  description: Optional project description
                sbomFile:
                  type: string
                  description: The container SBOM file to upload (CycloneDX JSON or SPDX). Only one file per request.
                  format: binary
      responses:
        '403':
          description: Insufficient permissions to create a project in this application
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Invalid SBOM file format or malformed request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '201':
          description: Container SBOM import successfully queued and project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SbomScanResponseDTO'
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DWRResponseV3SbomScanResponseDTO'
  /api/v3.0/orgs/{orgUuid}/applications/{applicationUuid}/findings/state:
    patch:
      tags:
      - Applications
      summary: Bulk Update Application Findings State
      operationId: updateApplicationFindingsState
      parameters:
