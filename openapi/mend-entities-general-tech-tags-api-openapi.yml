openapi: 3.2.0
info:
  title: Mend Entities - General Tech Tags API
  description: 'Mend''s enhanced SCA API enables automation of workflows in a REST compliant format. The API features:

    + Access for any user with Mend credentials, via a user key available in the user''s profile page in the Mend App.

    + Improved security with a JWT token per organization, which expires every 10 minutes.

    + Added scalability with support for pagination, filtering and sorting search results.

    + Broader functionality available programmatically.

    + New standard API documentation for easy navigation and search.


    **Note:** To help you get started with the Mend SCA API 2.0, we recommend reviewing our onboarding guide -> Getting Started with Mend SCA API 2.0.

    This resource covers initial setup, authentication instructions, and helpful tips to help you successfully begin working with the Mend SCA API 2.0. If you have a dedicated instance of Mend, contact your Mend representative to access this API on your instance.'
  version: 3.0.1
servers:
- url: https://api-saas.mend.io
  description: Generated server url
security:
- bearer-key: []
tags:
- name: Entities - General Tech Tags
paths:
  /api/v2.0/techTags/invalidate:
    post:
      tags:
      - Entities - General Tech Tags
      summary: Invalidate cached tech tag definitions
      description: Invalidate cached tech tags
      operationId: invalidateTechTagDefinitions
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDTO'
  /api/v2.0/techTags:
    get:
      tags:
      - Entities - General Tech Tags
      summary: Get tech tag definitions
      description: Get current tech tags definition
      operationId: getTechTagDefinitions
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechTagDefinitionsDTO'
components:
  schemas:
    TagRule:
      type: object
      properties:
        or:
          type: array
          items:
            $ref: '#/components/schemas/TagsMust'
        deduced:
          type: string
    TechTagDefinitionsDTO:
      type: object
      properties:
        librarySubstringsToClassification:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        tagRules:
          type: array
          items:
            $ref: '#/components/schemas/TagRule'
        tagsToLabels:
          type: object
          additionalProperties:
            type: string
        defaultLabel:
          type: string
    TagsMust:
      type: object
      properties:
        must:
          type: array
          items:
            type: string
    MessageDTO:
      type: object
      properties:
        message:
          title: message
          type: string
          example: Success!
    DWRResponseBase:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
  securitySchemes:
    bearer-key:
      type: http
      description: JWT token Bearer
      scheme: bearer
      bearerFormat: JWT
