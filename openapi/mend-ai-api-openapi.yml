openapi: 3.2.0
info:
  title: Mend AI API
  description: Mend's enhanced API enables automation of workflows in a REST compliant format.
  version: '3.0'
servers:
- url: https://baseUrl
  description: Generated server url
security:
- bearer-key: []
tags:
- name: AI
paths:
  /api/v3.0/ai/implementationweakness:
    get:
      security:
      - bearer-key: []
      description: Returns a list of implementation weakness types and their details
      tags:
      - AI
      summary: Get implementation weaknesses
      operationId: getImplementationWeaknesses
      parameters:
      - description: Filter by specific weakness ID
        name: weaknessID
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/v3.V3ImplementationWeaknessResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: string
components:
  schemas:
    v3.V3ImplementationWeaknessResponse:
      type: object
      properties:
        weaknessID:
          type: string
        weaknessCategory:
          type: string
        weaknessSeverity:
          type: string
        weaknessScore:
          type: string
        weaknessTitle:
          type: string
        owaspCategory:
          type: string
        weaknessDescription:
          type: string
        weaknessPotentialImpact:
          type: string
        weaknessBestPractices:
          type: string
        weaknessReferences:
          type: string
  securitySchemes:
    bearer-key:
      type: http
      description: JWT token Bearer
      scheme: bearer
      bearerFormat: JWT
