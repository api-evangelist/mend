      summary: Remove User From Group
      description: Deletes a user from an organization's group
      operationId: deleteUserFromGroup
      parameters:
      - name: orgUuid
        in: path
        description: Org UUID (Administration > General)
        required: true
        schema:
          type: string
      - name: groupUuid
        in: path
        description: Group UUID (Administration > Groups)
        required: true
        schema:
          type: string
      - name: userUuid
        in: path
        description: User UUID (Administration > Users)
        required: true
        schema:
          type: string
