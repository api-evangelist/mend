openapi: 3.2.0
info:
  title: Mend Tracked Issues API
  description: 'Mend''s enhanced SCA API enables automation of workflows in a REST compliant format. The API features:

    + Access for any user with Mend credentials, via a user key available in the user''s profile page in the Mend App.

    + Improved security with a JWT token per organization, which expires every 10 minutes.

    + Added scalability with support for pagination, filtering and sorting search results.

    + Broader functionality available programmatically.

    + New standard API documentation for easy navigation and search.


    **Note:** To help you get started with the Mend SCA API 2.0, we recommend reviewing our onboarding guide -> Getting Started with Mend SCA API 2.0.

    This resource covers initial setup, authentication instructions, and helpful tips to help you successfully begin working with the Mend SCA API 2.0. If you have a dedicated instance of Mend, contact your Mend representative to access this API on your instance.'
  version: 3.0.1
servers:
- url: https://api-saas.mend.io
  description: Generated server url
security:
- bearer-key: []
tags:
- name: Tracked Issues
paths:
  /api/v2.0/projects/{projectToken}/trackedIssues/{trackedIssueUuid}:
    get:
      tags:
      - Tracked Issues
      summary: Get tracked issue by uuid
      description: Returns a tracked issue by uuid
      operationId: getTrackedIssueByUuid
      parameters:
      - name: projectToken
        in: path
        description: 'project UUID (by running Entities - Product > Get Product Projects) or Project Token (from the Mend SCA App: **Integrate** tab > **Project Token**).'
        required: true
        schema:
          type: string
      - name: trackedIssueUuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackedIssueDTO'
    put:
      tags:
      - Tracked Issues
      summary: Update tracked issue by uuid
      description: Update tracked issue status, key, failure reason, etc. by uuid
      operationId: updateTrackedIssueByUuid
      parameters:
      - name: projectToken
        in: path
        description: 'project UUID (by running Entities - Product > Get Product Projects) or Project Token (from the Mend SCA App: **Integrate** tab > **Project Token**).'
        required: true
        schema:
          type: string
      - name: trackedIssueUuid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackedIssueUpdateRequestDTO'
        required: true
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackedIssueDTO'
  /api/v2.0/projects/{projectToken}/trackedIssues/issues:
    post:
      tags:
      - Tracked Issues
      summary: Get project tracked issues by list of issue ids
      description: Returns a all tracked issues by list of issue ids
      operationId: getTrackedIssuesInList
      parameters:
      - name: projectToken
        in: path
        description: 'project UUID (by running Entities - Product > Get Product Projects) or Project Token (from the Mend SCA App: **Integrate** tab > **Project Token**).'
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackedIssueByIdsRequestDTO'
        required: true
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrackedIssueDTO'
  /api/v2.0/products/{productToken}/trackedIssues/issues:
    post:
      tags:
      - Tracked Issues
      summary: Get product tracked issues by list of issue ids
      description: Returns a all tracked issues by list of issue ids for specific product
      operationId: getTrackedIssuesInListByProduct
      parameters:
      - name: productToken
        in: path
        description: 'product UUID (by running Entities - Organization > Get Organization Products) or Product Token (from the Mend SCA App: **Integrate** tab > **Product Token**).'
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackedIssueByIdsRequestDTO'
        required: true
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrackedIssueDTO'
  /api/v2.0/projects/{projectToken}/trackedIssues:
    get:
      tags:
      - Tracked Issues
      summary: Get project tracked issues
      description: Returns a all tracked issues for project
      operationId: getTrackedIssues
      parameters:
      - name: projectToken
        in: path
        description: 'project UUID (by running Entities - Product > Get Product Projects) or Project Token (from the Mend SCA App: **Integrate** tab > **Project Token**).'
        required: true
        schema:
          type: string
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrackedIssueDTO'
components:
  schemas:
    TrackedIssueByIdsRequestDTO:
      type: object
      properties:
        issueIds:
          type: array
          items:
            type: string
    EntityDTO:
      type: object
      properties:
        uuid:
          type: string
        name:
          type: string
    TrackedIssueUpdateRequestDTO:
      type: object
      properties:
        status:
          type: string
          enum:
          - PENDING
          - IN_PROGRESS
          - SUCCESS
          - FAILED
          - DELETED
        issueStatus:
          type: string
        failureReason:
          type: string
        issueKey:
          type: string
        publicLink:
          type: string
    TrackedIssueDTO:
      type: object
      properties:
        uuid:
          type: string
        issueId:
          type: string
        origin:
          type: string
        issueKey:
          type: string
        account:
          $ref: '#/components/schemas/EntityDTO'
        domain:
          $ref: '#/components/schemas/EntityDTO'
        application:
          $ref: '#/components/schemas/EntityDTO'
        project:
          $ref: '#/components/schemas/EntityDTO'
        status:
          type: string
          enum:
          - PENDING
          - IN_PROGRESS
          - SUCCESS
          - FAILED
          - DELETED
        issueStatus:
          type: string
        failureReason:
          type: string
        errorMessage:
          type: string
        publicLink:
          type: string
        creationDate:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          $ref: '#/components/schemas/EntityDTO'
        ticketType:
          type: string
          enum:
          - SECURITY
          - LEGAL
    DWRResponseBase:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
  securitySchemes:
    bearer-key:
      type: http
      description: JWT token Bearer
      scheme: bearer
      bearerFormat: JWT
x-provenance:
  method: harvested
  publisher: Mend
  source: https://api-saas.mend.io/v3/api-docs
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
