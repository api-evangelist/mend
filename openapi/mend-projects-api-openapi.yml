  /api/v3.0/projects/{projectUuid}/container/importSbom:
    post:
      tags:
      - Projects
      summary: Import a container SBOM into a project (Cloud Native)
      description: Upload a pre-generated container SBOM (CycloneDX JSON or SPDX JSON/tag-value) to import into an existing project. The scan is queued for asynchronous processing by the cloud-native engine.
      operationId: importContainerSbom
      parameters:
      - name: projectUuid
        in: path
        description: Project UUID (Administration > Projects)
        required: true
        schema:
          type: string
      - name: imageName
        in: query
        description: Optional image name recorded on the scan (e.g. alpine:3.19).
        required: false
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - sbomFile
              type: object
              properties:
                sbomFile:
                  type: string
                  description: The container SBOM file to upload (CycloneDX JSON or SPDX). Only one file per request.
                  format: binary
      responses:
        '403':
          description: Insufficient permissions to update this project
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Invalid SBOM file format or malformed request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DWRResponseV3SbomScanResponseDTO'
        '200':
          description: Container SBOM import successfully queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SbomScanResponseDTO'
