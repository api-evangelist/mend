openapi: 3.2.0
info:
  title: Mend Entities - Application Configurations API
  description: 'Mend''s enhanced SCA API enables automation of workflows in a REST compliant format. The API features:

    + Access for any user with Mend credentials, via a user key available in the user''s profile page in the Mend App.

    + Improved security with a JWT token per organization, which expires every 10 minutes.

    + Added scalability with support for pagination, filtering and sorting search results.

    + Broader functionality available programmatically.

    + New standard API documentation for easy navigation and search.


    **Note:** To help you get started with the Mend SCA API 2.0, we recommend reviewing our onboarding guide -> Getting Started with Mend SCA API 2.0.

    This resource covers initial setup, authentication instructions, and helpful tips to help you successfully begin working with the Mend SCA API 2.0. If you have a dedicated instance of Mend, contact your Mend representative to access this API on your instance.'
  version: 3.0.1
servers:
- url: https://api-saas.mend.io
  description: Generated server url
security:
- bearer-key: []
tags:
- name: Entities - Application Configurations
paths:
  /api/v3.0/applications/{applicationUuid}/configurations:
    get:
      tags:
      - Entities - Application Configurations
      summary: Get configuration of application
      description: Get configuration of an application
      operationId: getApplicationConfiguration
      parameters:
      - name: applicationUuid
        in: path
        description: application UUID.
        required: true
        schema:
          type: string
      - name: namespace
        in: query
        description: Configuration Namespace
        required: true
        schema:
          type: string
          enum:
          - Code
          - AI
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationDTO'
    delete:
      tags:
      - Entities - Application Configurations
      summary: Remove Code configuration from application
      description: Removes Code configuration from an application
      operationId: unassignApplicationConfiguration
      parameters:
      - name: applicationUuid
        in: path
        description: application UUID.
        required: true
        schema:
          type: string
      - name: namespace
        in: query
        description: Configuration Namespace
        required: true
        schema:
          type: string
          enum:
          - Code
          - AI
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDTO'
components:
  schemas:
    ConfigurationDTO:
      type: object
      properties:
        uuid:
          type: string
        namespace:
          type: string
        value:
          type: string
        displayName:
          type: string
        contextType:
          type: string
    DWRResponseBase:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
    MessageDTO:
      type: object
      properties:
        message:
          title: message
          type: string
          example: Success!
  securitySchemes:
    bearer-key:
      type: http
      description: JWT token Bearer
      scheme: bearer
      bearerFormat: JWT
