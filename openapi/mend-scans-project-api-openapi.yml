        sla:
          type: string
        workflowUuid:
          type: string
        workflowName:
          type: string
        createdAt:
          type: string
          format: date-time
    ProgressDTO:
      required:
      - currentStage
      - overallPercentage
      type: object
      properties:
        overallPercentage:
          maximum: 100
          minimum: 0
          type: integer
          format: int32
        currentStage:
          maxLength: 255
          minLength: 0
          type: string
    CreateScanRequestDTO:
      type: object
      properties:
        type:
          type: string
          enum:
          - SCA
          - SAST
          - UNIFIED
          - IAC
          - IMG
          - DAST
          - AI
          - REDTEAM
