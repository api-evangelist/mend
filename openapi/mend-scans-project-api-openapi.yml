        isUpdateProject:
          type: boolean
        isVisible:
          type: boolean
    MatchedFindingInfo:
      type: object
      properties:
        findingId:
          type: string
        findingName:
          type: string
        findingType:
          type: string
        elementUuid:
          type: string
        elementName:
          type: string
        workflowUuid:
          type: string
        workflowName:
          type: string
        refId:
          type: string
        risk:
          type: integer
          format: int32
        slaRelativeDays:
          type: integer
          format: int32
        updateExisting:
          type: boolean
        violationType:
          type: string
          enum:
          - SECURITY
          - LEGAL
        findingExtraData:
          type: object
          additionalProperties:
            type: object
        uniqueKey:
          type: string
    MessageDTO:
      type: object
      properties:
        message:
          title: message
          type: string
          example: Success!
    ScanTagDTO:
      type: object
      properties:
        key:
          title: Scan Tag Key
          type: string
          example: commit
        value:
          title: Scan Tag Value
          type: string
          example: 123abc
        displayName:
          title: Scan Tag Display Name
          type: string
          example: commit:123abc
        createdAt:
          title: Scan Tag Creation Date
          type: string
          format: date-time
    DWRResponseBase:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
    ScanDTO:
      type: object
      properties:
        uuid:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
          - SCA
          - SAST
          - UNIFIED
          - IAC
          - IMG
          - DAST
          - AI
          - REDTEAM
          - CN
        status:
          type: string
          enum:
          - PLACE_HOLDER_01
          - PLACE_HOLDER_02
          - PLACE_HOLDER_03
          - RUNNING
          - PLACE_HOLDER_04
          - PLACE_HOLDER_05
          - PLACE_HOLDER_06
          - PARTIAL
          - PROCESSING
          - PLACE_HOLDER_07
          - PLACE_HOLDER_08
          - PLACE_HOLDER_09
          - FINISHED
          - PLACE_HOLDER_10
          - PLACE_HOLDER_11
          - PLACE_HOLDER_12
          - FAILED
        aeStatus:
          type: string
          enum:
          - FAILED
          - PROCESSED
          - PARTIAL
          - IGNORED
        ufDbStatus:
          type: string
          enum:
          - FAILED
          - STORED
        projectId:
          type: integer
          format: int32
        productId:
          type: integer
          format: int32
        domainId:
          type: integer
          format: int32
        projectUuid:
          type: string
        processUuid:
          type: string
        hasViolations:
          type: boolean
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        lastModified:
          type: string
          format: date-time
        configurationName:
          type: string
        enforceFailedBuild:
          type: boolean
        reference:
          type: string
        triggeredBy:
          type: string
        agentInfo:
          $ref: '#/components/schemas/ScanAgentInfo'
        workflowUuids:
          type: array
          items:
            type: string
        workflowNames:
          type: array
          items:
            type: string
        supportToken:
          type: string
        progress:
          $ref: '#/components/schemas/ProgressDTO'
    DWRResponseMatchedFindingInfoWrapper:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
        retVal:
