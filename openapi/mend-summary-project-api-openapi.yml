openapi: 3.2.0
info:
  title: Mend Summary - Project API
  description: 'Mend''s enhanced SCA API enables automation of workflows in a REST compliant format. The API features:

    + Access for any user with Mend credentials, via a user key available in the user''s profile page in the Mend App.

    + Improved security with a JWT token per organization, which expires every 10 minutes.

    + Added scalability with support for pagination, filtering and sorting search results.

    + Broader functionality available programmatically.

    + New standard API documentation for easy navigation and search.


    **Note:** To help you get started with the Mend SCA API 2.0, we recommend reviewing our onboarding guide -> Getting Started with Mend SCA API 2.0.

    This resource covers initial setup, authentication instructions, and helpful tips to help you successfully begin working with the Mend SCA API 2.0. If you have a dedicated instance of Mend, contact your Mend representative to access this API on your instance.'
  version: 3.0.1
servers:
- url: https://api-saas.mend.io
  description: Generated server url
security:
- bearer-key: []
tags:
- name: Summary - Project
paths:
  /api/v2.0/orgs/{orgIdentifier}/projects/summaries/total:
    post:
      tags:
      - Summary - Project
      summary: Get Project Statistics
      description: Returns the requested statistics for the given projects
      operationId: getTotalSummary
      parameters:
      - name: orgIdentifier
        in: path
        description: entity UUID or ApiToken (organization, product or project).
        required: true
        schema:
          type: string
      - name: categories
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MultiContextRequestDTO'
        required: true
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content: {}
  /api/v2.0/orgs/{orgIdentifier}/projects/summaries:
    post:
      tags:
      - Summary - Project
      summary: Get Project Statistics
      description: Returns the requested statistics for the given projects
      operationId: getProjectSummaries_1
      parameters:
      - name: orgIdentifier
        in: path
        description: entity UUID or ApiToken (organization, product or project).
        required: true
        schema:
          type: string
      - name: categories
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
      - name: ignoreActivityFilter
        in: query
        required: false
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MultiContextRequestDTO'
        required: true
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectSummaryDTO'
components:
  schemas:
    EntityConfigurationDTO:
      type: object
      properties:
        domainConfigUuid:
          type: string
        namespace:
          type: string
        value:
          type: string
        displayName:
          type: string
        contextType:
          type: string
    EntityLabelDTO:
      type: object
      properties:
        uuid:
          type: string
        namespace:
          type: string
        value:
          type: string
        displayName:
          type: string
        contextType:
          type: string
        system:
          type: boolean
    EntityTagDTO:
      type: object
      properties:
        key:
          title: Entity Tag Key
          type: string
          example: key
        value:
          title: Entity Tag value
          type: string
          example: value
    ProjectSummaryDTO:
      type: object
      properties:
        uuid:
          title: Project UUID
          type: string
          example: 123e4567-e89b-12d3-a456-426655440000
        name:
          title: Project Name
          type: string
          example: My Project
        path:
          title: Product Name
          type: string
          example: My Product
        productName:
          title: Product Name
          type: string
          example: My Product
        productUuid:
          title: Product Uuid
          type: string
          example: 123e4567-e89b-12d3-a456-426655440000
        creationDate:
          type: string
          format: date-time
        active:
          type: boolean
        lastScanned:
          type: string
          format: date-time
          deprecated: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/EntityTagDTO'
        labels:
          type: array
          items:
            $ref: '#/components/schemas/EntityLabelDTO'
        configurations:
          type: array
          items:
            $ref: '#/components/schemas/EntityConfigurationDTO'
        statistics:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: integer
              format: int64
    MultiContextRequestDTO:
      type: object
      properties:
        projectIdentifiers:
          type: array
          items:
            title: Project Identifiers
            type: string
            example: 123e4567-e89b-12d3-a456-426655440000
        productIdentifiers:
          type: array
          items:
            title: Product Identifier
            type: string
            example: 123e4567-e89b-12d3-a456-426655440000
      description: If projectIdentifiers and productIdentifiers are empty, action will apply to the whole organization
    DWRResponseBase:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
  securitySchemes:
    bearer-key:
      type: http
      description: JWT token Bearer
      scheme: bearer
      bearerFormat: JWT
