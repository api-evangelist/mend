openapi: 3.2.0
info:
  title: Mend Domain Approval Requests Controller API
  description: 'Mend''s enhanced SCA API enables automation of workflows in a REST compliant format. The API features:

    + Access for any user with Mend credentials, via a user key available in the user''s profile page in the Mend App.

    + Improved security with a JWT token per organization, which expires every 10 minutes.

    + Added scalability with support for pagination, filtering and sorting search results.

    + Broader functionality available programmatically.

    + New standard API documentation for easy navigation and search.


    **Note:** To help you get started with the Mend SCA API 2.0, we recommend reviewing our onboarding guide -> Getting Started with Mend SCA API 2.0.

    This resource covers initial setup, authentication instructions, and helpful tips to help you successfully begin working with the Mend SCA API 2.0. If you have a dedicated instance of Mend, contact your Mend representative to access this API on your instance.'
  version: 3.0.1
servers:
- url: https://api-saas.mend.io
  description: Generated server url
security:
- bearer-key: []
tags:
- name: domain-approval-requests-controller
paths:
  /api/v2.0/orgs/{orgToken}/approvalRequests:
    get:
      tags:
      - domain-approval-requests-controller
      summary: Get organization suppression requests
      description: Returns the suppression requests related to the organization
      operationId: getDomainApprovalRequests
      parameters:
      - name: orgToken
        in: path
        description: 'org UUID (by running Entities - Organization > Get User Organizations) or API Key (from the Mend SCA App: **Integrate** tab > **API Key**).'
        required: true
        schema:
          type: string
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DWRResponseListProjectApprovalRequestDTO'
    put:
      tags:
      - domain-approval-requests-controller
      summary: Update multiple suppression requests state
      description: Updates the state of multiple organization suppression requests
      operationId: updateMultipleDomainApprovalRequests
      parameters:
      - name: orgToken
        in: path
        description: 'org UUID (by running Entities - Organization > Get User Organizations) or API Key (from the Mend SCA App: **Integrate** tab > **API Key**).'
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMultipleProjectApprovalsRequestDTO'
        required: true
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DWRResponseMessageDTO'
components:
  schemas:
    ProjectApprovalRequestDTO:
      required:
      - branchType
      - engine
      - state
      type: object
      properties:
        uuid:
          type: string
        name:
          type: string
        projectUuid:
          type: string
        projectName:
          type: string
        productUuid:
          type: string
        productName:
          type: string
        engine:
          type: string
          description: Type of engine the suppression request relates to
          example: SAST
          enum:
          - UNIFIED
          - SCA
          - SAST
          - IAC
          - IMG
          - AI
          - DAST
        elementUuid:
          type: string
        elementDescription:
          type: string
        elementOrigin:
          type: string
        elementSeverity:
          type: string
          description: 'Severity of the element requested for approval. Can be one of: LOW, MEDIUM, HIGH, CRITICAL'
          example: HIGH
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
        elementDate:
          type: string
          format: date-time
        branchType:
          type: string
          description: Type of branch
          example: BASE
          enum:
          - BASE
          - FEATURE
          - BASE
          - FEATURE
        scanUuid:
          type: string
        externalUser:
          type: string
          description: External/repository user identifier
          example: username
        repoIssueId:
          type: string
          description: Identifier of a corresponding repository issue of the element requested for suppression approval.
          example: '1'
        reason:
          type: string
        state:
          type: string
          description: State of suppression request
          example: PENDING
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - REQUESTED_INFO
          - PENDING
          - APPROVED
          - REJECTED
          - REQUESTED_INFO
        responseDate:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        updatedBy:
          type: string
    DWRResponseMessageDTO:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
        retVal:
          $ref: '#/components/schemas/MessageDTO'
    MessageDTO:
      type: object
      properties:
        message:
          title: message
          type: string
          example: Success!
    DWRResponseListProjectApprovalRequestDTO:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
        retVal:
          type: array
          items:
            $ref: '#/components/schemas/ProjectApprovalRequestDTO'
    DWRResponseBase:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
    UpdateMultipleProjectApprovalsRequestDTO:
      required:
      - action
      - elementUuids
      type: object
      properties:
        action:
          type: string
          description: Action to execute on the suppression request
          example: APPROVE
          enum:
          - APPROVE
          - REJECT
          - REQUEST_INFO
          - MARK_PENDING
        comment:
          type: string
          description: Reviewer note
          example: More details are required
        elementUuids:
          type: array
          description: List of identifiers of the suppression requests to update
          example: 123e4567-e89b-12d3-a456-426655440000
          items:
            type: string
            description: List of identifiers of the suppression requests to update
            example: 123e4567-e89b-12d3-a456-426655440000
  securitySchemes:
    bearer-key:
      type: http
      description: JWT token Bearer
      scheme: bearer
      bearerFormat: JWT
