openapi: 3.2.0
info:
  title: Mend Dashboard API
  description: 'Mend''s enhanced SCA API enables automation of workflows in a REST compliant format. The API features:

    + Access for any user with Mend credentials, via a user key available in the user''s profile page in the Mend App.

    + Improved security with a JWT token per organization, which expires every 10 minutes.

    + Added scalability with support for pagination, filtering and sorting search results.

    + Broader functionality available programmatically.

    + New standard API documentation for easy navigation and search.


    **Note:** To help you get started with the Mend SCA API 2.0, we recommend reviewing our onboarding guide -> Getting Started with Mend SCA API 2.0.

    This resource covers initial setup, authentication instructions, and helpful tips to help you successfully begin working with the Mend SCA API 2.0. If you have a dedicated instance of Mend, contact your Mend representative to access this API on your instance.'
  version: 3.0.1
servers:
- url: https://api-saas.mend.io
  description: Generated server url
security:
- bearer-key: []
tags:
- name: Dashboard
paths:
  /api/v2.0/orgs/{orgIdentifier}/dashboards/{dashboardUuid}:
    get:
      tags:
      - Dashboard
      summary: Get Dashboard
      description: Not supported yet
      operationId: getDashboard
      parameters:
      - name: orgIdentifier
        in: path
        description: 'org UUID (by running Entities - Organization > Get User Organizations) or API Key (from the Mend SCA App: **Integrate** tab > **API Key**).'
        required: true
        schema:
          type: string
      - name: dashboardUuid
        in: path
        description: dashboard UUID
        required: true
        schema:
          type: string
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardDTO'
    put:
      tags:
      - Dashboard
      summary: Update Dashboard
      description: Not suppurtd yet
      operationId: updateDashboard
      parameters:
      - name: orgIdentifier
        in: path
        description: 'org UUID (by running Entities - Organization > Get User Organizations) or API Key (from the Mend SCA App: **Integrate** tab > **API Key**).'
        required: true
        schema:
          type: string
      - name: dashboardUuid
        in: path
        description: dashboard UUID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardRequestDTO'
        required: true
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardDTO'
    delete:
      tags:
      - Dashboard
      summary: Delete Dashboard
      description: Not supported yet
      operationId: removeDashboard
      parameters:
      - name: orgIdentifier
        in: path
        description: 'org UUID (by running Entities - Organization > Get User Organizations) or API Key (from the Mend SCA App: **Integrate** tab > **API Key**).'
        required: true
        schema:
          type: string
      - name: dashboardUuid
        in: path
        description: dashboard UUID
        required: true
        schema:
          type: string
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
  /api/v2.0/orgs/{orgIdentifier}/dashboards:
    get:
      tags:
      - Dashboard
      summary: Get Organization Dashboards
      operationId: getAllDashboards
      parameters:
      - name: orgIdentifier
        in: path
        description: 'org UUID (by running Entities - Organization > Get User Organizations) or API Key (from the Mend SCA App: **Integrate** tab > **API Key**).'
        required: true
        schema:
          type: string
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DashboardDTO'
    post:
      tags:
      - Dashboard
      summary: Create Dashboard
      description: Not supported yet
      operationId: createDashboard
      parameters:
      - name: orgIdentifier
        in: path
        description: 'org UUID (by running Entities - Organization > Get User Organizations) or API Key (from the Mend SCA App: **Integrate** tab > **API Key**).'
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardRequestDTO'
        required: true
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardDTO'
  /api/v2.0/orgs/{orgIdentifier}/dashboards/widgets:
    get:
      tags:
      - Dashboard
      summary: Get widgets
      description: Not supported yet
      operationId: getWidgets
      parameters:
      - name: orgIdentifier
        in: path
        description: 'org UUID (by running Entities - Organization > Get User Organizations) or API Key (from the Mend SCA App: **Integrate** tab > **API Key**).'
        required: true
        schema:
          type: string
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
components:
  schemas:
    VulnerableLibrariesWidget:
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseWidget'
    VulnerabilitiesByEffectivenessWidget:
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseWidget'
    VulnerableLibrariesPerProjectWidgetDTO:
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseWidgetDTO'
      - type: object
        properties:
          visualization:
            type: string
            enum:
            - PIE_CHART
          showChart:
            type: boolean
          showList:
            type: boolean
    BaseWidget:
      required:
      - type
      type: object
      properties:
        title:
          type: string
        type:
          type: string
      discriminator:
        propertyName: type
    DWRResponseBase:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
    GeneralStatisticsWidgetDTO:
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseWidgetDTO'
      - type: object
        properties:
          showNumberOfProjects:
            type: boolean
          showNumberOfLicenseTypes:
            type: boolean
          showNumberOfLibraries:
            type: boolean
    GeneralStatisticsWidget:
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseWidget'
      - type: object
        properties:
          showNumberOfProjects:
            type: boolean
          showNumberOfLicenseTypes:
            type: boolean
          showNumberOfLibraries:
            type: boolean
    DashboardRequestDTO:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        layout:
          type: string
        widgets:
          type: array
          items:
            type: array
            items:
              oneOf:
              - $ref: '#/components/schemas/FrameWidget'
              - $ref: '#/components/schemas/GeneralStatisticsWidget'
              - $ref: '#/components/schemas/LicenseRiskWidget'
              - $ref: '#/components/schemas/LicensesDistributionWidget'
              - $ref: '#/components/schemas/OutdatedLibrariesCompareWidget'
              - $ref: '#/components/schemas/OutdatedLibrariesWidget'
              - $ref: '#/components/schemas/VulnerabilitiesByEffectivenessWidget'
              - $ref: '#/components/schemas/VulnerableLibrariesCompareWidget'
              - $ref: '#/components/schemas/VulnerableLibrariesPerProductWidget'
              - $ref: '#/components/schemas/VulnerableLibrariesPerProjectWidget'
              - $ref: '#/components/schemas/VulnerableLibrariesWidget'
    OutdatedLibrariesCompareWidget:
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseWidget'
    LicenseRiskWidgetDTO:
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseWidgetDTO'
      - type: object
        properties:
          showHigh:
            type: boolean
          showMedium:
            type: boolean
          showLow:
            type: boolean
          showUnknownRisk:
            type: boolean
          showLibrariesWithoutLicense:
            type: boolean
    BaseFrameableWidget:
      required:
      - type
      type: object
      properties:
        title:
          type: string
        type:
          type: string
      discriminator:
        propertyName: type
    DashboardDTO:
      type: object
      properties:
        uuid:
          type: string
        name:
          type: string
        description:
          type: string
        created:
          type: string
        updated:
          type: string
        ownerUsername:
          type: string
        layout:
          type: string
        widgets:
          type: array
          items:
            type: array
            items:
              oneOf:
              - $ref: '#/components/schemas/FrameWidgetDTO'
              - $ref: '#/components/schemas/GeneralStatisticsWidgetDTO'
              - $ref: '#/components/schemas/LicenseRiskWidgetDTO'
              - $ref: '#/components/schemas/LicensesDistributionWidgetDTO'
              - $ref: '#/components/schemas/VulnerabilitiesByEffectivenessWidgetDTO'
              - $ref: '#/components/schemas/VulnerableLibrariesPerProductWidgetDTO'
              - $ref: '#/components/schemas/VulnerableLibrariesPerProjectWidgetDTO'
    LicensesDistributionWidget:
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseWidget'
      - type: object
        properties:
          visualization:
            type: string
            enum:
            - PIE_CHART
          showChart:
            type: boolean
          showList:
            type: boolean
    VulnerableLibrariesCompareWidget:
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseWidget'
    LicensesDistributionWidgetDTO:
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseWidgetDTO'
      - type: object
        properties:
          visualization:
            type: string
            enum:
            - PIE_CHART
          showChart:
            type: boolean
          showList:
            type: boolean
    FrameWidget:
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseWidget'
      - type: object
        properties:
          widgets:
            type: array
            items:
              $ref: '#/components/schemas/BaseFrameableWidget'
    VulnerableLibrariesPerProductWidgetDTO:
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseWidgetDTO'
      - type: object
        properties:
          visualization:
            type: string
            enum:
            - PIE_CHART
          showChart:
            type: boolean
          showList:
            type: boolean
    OutdatedLibrariesWidget:
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseWidget'
    VulnerableLibrariesPerProjectWidget:
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseWidget'
      - type: object
        properties:
          visualization:
            type: string
            enum:
            - PIE_CHART
          showChart:
            type: boolean
          showList:
            type: boolean
    VulnerableLibrariesPerProductWidget:
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseWidget'
      - type: object
        properties:
          visualization:
            type: string
            enum:
            - PIE_CHART
          showChart:
            type: boolean
          showList:
            type: boolean
    VulnerabilitiesByEffectivenessWidgetDTO:
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseWidgetDTO'
    LicenseRiskWidget:
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseWidget'
      - type: object
        properties:
          showHigh:
            type: boolean
          showMedium:
            type: boolean
          showLow:
            type: boolean
          showUnknownRisk:
            type: boolean
          showLibrariesWithoutLicense:
            type: boolean
    FrameWidgetDTO:
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseWidgetDTO'
      - type: object
        properties:
          widgets:
            type: array
            items:
              $ref: '#/components/schemas/BaseFrameableWidgetDTO'
    BaseWidgetDTO:
      required:
      - type
      type: object
      properties:
        title:
          type: string
        type:
          type: string
      discriminator:
        propertyName: type
    BaseFrameableWidgetDTO:
      required:
      - type
      type: object
      properties:
        title:
          type: string
        type:
          type: string
      discriminator:
        propertyName: type
  securitySchemes:
    bearer-key:
      type: http
      description: JWT token Bearer
      scheme: bearer
      bearerFormat: JWT
x-provenance:
  method: harvested
  publisher: Mend
  source: https://api-saas.mend.io/v3/api-docs
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
