          format: int32
        remediationBacklogHigh:
          type: integer
          format: int32
        remediationBacklogMedium:
          type: integer
          format: int32
        remediationBacklogLow:
          type: integer
          format: int32
        suppressionNewCritical:
          type: integer
          format: int32
        suppressionNewHigh:
