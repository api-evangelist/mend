          type: string
          example: 1171c60d
        response:
          $ref: '#/components/schemas/AllowlistIpDTO'
    ToggleAllowlistRequestDTO:
      type: object
      properties:
        includeLegacy:
          type: boolean
    DWRResponseV3MessageDTO:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
        response:
          $ref: '#/components/schemas/MessageDTO'
    AllowlistIpUpdateStatusRequestDTO:
      type: object
      properties:
        active:
          type: boolean
    CheckAllowlistIpRequestDTO:
      type: object
      properties:
        ip:
          type: string
    MessageDTO:
      type: object
      properties:
        message:
          title: message
          type: string
          example: Success!
    DWRResponseBase:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
  securitySchemes:
    bearer-key:
      type: http
      description: JWT token Bearer
      scheme: bearer
      bearerFormat: JWT
