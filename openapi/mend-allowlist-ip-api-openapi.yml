components:
  schemas:
    DWRResponseV3Boolean:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
        response:
          type: boolean
    AllowlistIpUpdateRequestDTO:
      type: object
      properties:
        ip:
          type: string
        description:
          type: string
    AllowlistIpRequestDTO:
      type: object
      properties:
        ip:
          type: string
        description:
          type: string
        active:
          type: boolean
    AllowlistIpDTO:
      type: object
      properties:
        uuid:
          type: string
        ip:
          type: string
        cidr:
          type: string
        description:
          type: string
        active:
          type: boolean
        updatedBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DWRResponsePageableV3ListAllowlistIpDTO:
      type: object
      properties:
