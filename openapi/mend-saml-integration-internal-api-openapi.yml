openapi: 3.2.0
info:
  title: Mend SAML Integration - Internal API
  description: 'Mend''s enhanced SCA API enables automation of workflows in a REST compliant format. The API features:

    + Access for any user with Mend credentials, via a user key available in the user''s profile page in the Mend App.

    + Improved security with a JWT token per organization, which expires every 10 minutes.

    + Added scalability with support for pagination, filtering and sorting search results.

    + Broader functionality available programmatically.

    + New standard API documentation for easy navigation and search.


    **Note:** To help you get started with the Mend SCA API 2.0, we recommend reviewing our onboarding guide -> Getting Started with Mend SCA API 2.0.

    This resource covers initial setup, authentication instructions, and helpful tips to help you successfully begin working with the Mend SCA API 2.0. If you have a dedicated instance of Mend, contact your Mend representative to access this API on your instance.'
  version: 3.0.1
servers:
- url: https://api-saas.mend.io
  description: Generated server url
security:
- bearer-key: []
tags:
- name: SAML Integration - Internal
paths:
  /api/v3.0/auth0/init:
    post:
      tags:
      - SAML Integration - Internal
      summary: Init Auth0 Tenant
      operationId: initializeAuth0Tenant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitializeAuth0TenantRequest'
        required: true
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DWRResponseV3String'
  /api/v3.0/auth0/check-expiries:
    post:
      tags:
      - SAML Integration - Internal
      summary: Check SAML Expiries - using all connections from Auth0
      operationId: checkSamlExpiries
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DWRResponseV3SAMLExpiryCheckSummaryDTO'
components:
  schemas:
    DWRResponseV3SAMLExpiryCheckSummaryDTO:
      type: object
      properties:
        additionalData:
          type: object
          additionalProperties:
            type: object
        supportToken:
          type: string
        response:
          $ref: '#/components/schemas/SAMLExpiryCheckSummaryDTO'
    DWRResponseV3String:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
        response:
          type: string
    InitializeAuth0TenantRequest:
      type: object
      properties:
        environmentName:
          type: string
        allowedCallbacks:
          type: array
          items:
            type: string
    ContextEntityDTO:
      required:
      - name
      type: object
      properties:
        uuid:
          title: Context Uuid
          type: string
          example: 123e4567-e89b-12d3-a456-426655440000
        name:
          title: Context Name
          type: string
          example: Context A
    SAMLExpiryCheckSummaryDTO:
      type: object
      properties:
        expiryToEntitiesMap:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/ContextEntityDTO'
        expiredEntitiesLog:
          type: array
          items:
            type: string
    DWRResponseBase:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
  securitySchemes:
    bearer-key:
      type: http
      description: JWT token Bearer
      scheme: bearer
      bearerFormat: JWT
x-provenance:
  method: harvested
  publisher: Mend
  source: https://api-saas.mend.io/v3/api-docs
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
