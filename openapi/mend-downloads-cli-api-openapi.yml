openapi: 3.2.0
info:
  title: Mend Downloads - CLI API
  description: 'Mend''s enhanced SCA API enables automation of workflows in a REST compliant format. The API features:

    + Access for any user with Mend credentials, via a user key available in the user''s profile page in the Mend App.

    + Improved security with a JWT token per organization, which expires every 10 minutes.

    + Added scalability with support for pagination, filtering and sorting search results.

    + Broader functionality available programmatically.

    + New standard API documentation for easy navigation and search.


    **Note:** To help you get started with the Mend SCA API 2.0, we recommend reviewing our onboarding guide -> Getting Started with Mend SCA API 2.0.

    This resource covers initial setup, authentication instructions, and helpful tips to help you successfully begin working with the Mend SCA API 2.0. If you have a dedicated instance of Mend, contact your Mend representative to access this API on your instance.'
  version: 3.0.1
servers:
- url: https://api-saas.mend.io
  description: Generated server url
security:
- bearer-key: []
tags:
- name: Downloads - CLI
paths:
  /api/v3.0/orgs/{orgUuid}/downloads/cli/{kind}:
    get:
      tags:
      - Downloads - CLI
      summary: Download CLI
      description: 'Redirects (302) to a freshly generated download link for one CLI runtime: the public URL for the wrapper, or a short-lived pre-signed URL for a gated artifact. When the request explicitly accepts application/json, the link is returned as a JSON body instead. The response is not cacheable.'
      operationId: downloadCli
      parameters:
      - name: orgUuid
        in: path
        description: Org UUID (Administration > General)
        required: true
        schema:
          type: string
      - name: kind
        in: path
        description: 'CLI kind: wrapper, selfContainedSca, selfContainedSast or selfContainedCombined'
        required: true
        schema:
          type: string
      - name: version
        in: query
        description: 'CLI version to link to: ''latest'' or a version from the CLI version matrix. Defaults to the organization''s configured CLI version'
        required: false
        schema:
          type: string
      - name: os
        in: query
        description: 'Operating system: mac, linux or windows'
        required: true
        schema:
          type: string
      - name: arch
        in: query
        description: 'Architecture: x64 or arm64'
        required: true
        schema:
          type: string
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DWRResponseV3CliDownloadUrlDTOV3'
  /api/v3.0/orgs/{orgUuid}/downloads/cli:
    get:
      tags:
      - Downloads - CLI
      summary: Get CLI Download Links
      description: Returns the download links for every available CLI runtime. Wrapper links are public; self-contained links are gated and are returned as pre-signed URLs only when 'signed' is true, otherwise they are empty and can be downloaded one at a time through Download CLI.
      operationId: getCliDownloads
      parameters:
      - name: orgUuid
        in: path
        description: Org UUID (Administration > General)
        required: true
        schema:
          type: string
      - name: version
        in: query
        description: 'CLI version to link to: ''latest'' or a version from the CLI version matrix. Defaults to the organization''s configured CLI version'
        required: false
        schema:
          type: string
      - name: signed
        in: query
        description: Generate pre-signed URLs for the gated artifacts
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DWRResponseV3CliDownloadsDTOV3'
components:
  schemas:
    DWRResponseV3CliDownloadUrlDTOV3:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
        response:
          $ref: '#/components/schemas/CliDownloadUrlDTOV3'
    DWRResponseV3CliDownloadsDTOV3:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
        response:
          $ref: '#/components/schemas/CliDownloadsDTOV3'
    CliDownloadsDTOV3:
      type: object
      properties:
        wrapper:
          title: Wrapper CLI
          type: array
          description: Public download links for the wrapper CLI
          items:
            $ref: '#/components/schemas/CliDownloadDTOV3'
        selfContainedSca:
          title: Self-Contained SCA CLI
          type: array
          description: Gated download links for the self-contained SCA CLI
          items:
            $ref: '#/components/schemas/CliDownloadDTOV3'
        selfContainedSast:
          title: Self-Contained SAST CLI
          type: array
          description: Gated download links for the self-contained SAST CLI
          items:
            $ref: '#/components/schemas/CliDownloadDTOV3'
        selfContainedCombined:
          title: Self-Contained Combined CLI
          type: array
          description: Gated download links for the self-contained combined CLI
          items:
            $ref: '#/components/schemas/CliDownloadDTOV3'
    CliDownloadUrlDTOV3:
      type: object
      properties:
        downloadUrl:
          title: Download URL
          type: string
          description: A public URL for the wrapper CLI, or a pre-signed S3 URL for a gated artifact
    DWRResponseBase:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
    CliDownloadDTOV3:
      title: Self-Contained Combined CLI
      type: object
      properties:
        os:
          title: Operating System
          type: string
          example: linux
          enum:
          - mac
          - linux
          - windows
        arch:
          title: Architecture
          type: string
          example: x64
          enum:
          - x64
          - arm64
        downloadUrl:
          title: Download URL
          type: string
          description: A public URL for the wrapper CLI, or a pre-signed S3 URL for a gated artifact. Empty when the artifact is gated and pre-signed URLs were not requested.
      description: Gated download links for the self-contained combined CLI
  securitySchemes:
    bearer-key:
      type: http
      description: JWT token Bearer
      scheme: bearer
      bearerFormat: JWT
x-provenance:
  method: harvested
  publisher: Mend
  source: https://api-saas.mend.io/v3/api-docs
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
