openapi: 3.2.0
info:
  title: Mend Usage Events API
  description: 'Mend''s enhanced SCA API enables automation of workflows in a REST compliant format. The API features:

    + Access for any user with Mend credentials, via a user key available in the user''s profile page in the Mend App.

    + Improved security with a JWT token per organization, which expires every 10 minutes.

    + Added scalability with support for pagination, filtering and sorting search results.

    + Broader functionality available programmatically.

    + New standard API documentation for easy navigation and search.


    **Note:** To help you get started with the Mend SCA API 2.0, we recommend reviewing our onboarding guide -> Getting Started with Mend SCA API 2.0.

    This resource covers initial setup, authentication instructions, and helpful tips to help you successfully begin working with the Mend SCA API 2.0. If you have a dedicated instance of Mend, contact your Mend representative to access this API on your instance.'
  version: 3.0.1
servers:
- url: https://api-saas.mend.io
  description: Generated server url
security:
- bearer-key: []
tags:
- name: Usage Events
paths:
  /api/v3.0/ui-usage/actions:
    post:
      tags:
      - Usage Events
      summary: Publish usage events
      description: Accepts a batch of UI usage events and forwards them for analytics processing.
      operationId: publishUsageEvents
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/UsageUiActionRequest'
        required: true
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageUiActionsResponse'
  /api/v3.0/internal/statistics/events:
    post:
      tags:
      - Usage Events
      summary: Publish InternalStatsEvent events
      description: Accepts a batch of InternalStatsEventDTOs and forwards them (after enrichment) for analytics processing.
      operationId: sendStatsEvent
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/InternalStatsEventDTO'
        required: true
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DWRResponseV3MessageDTO'
components:
  schemas:
    InternalStatsEventDTO:
      type: object
      properties:
        eventType:
          type: string
        sourceName:
          type: string
        projectName:
          type: string
        projectUuid:
          type: string
        domainName:
          type: string
        domainUuid:
          type: string
        applicationName:
          type: string
        applicationUuid:
          type: string
        data:
          type: object
          additionalProperties:
            type: string
    DWRResponseV3MessageDTO:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
        response:
          $ref: '#/components/schemas/MessageDTO'
    MessageDTO:
      type: object
      properties:
        message:
          title: message
          type: string
          example: Success!
    UsageUiActionRequest:
      type: object
      properties:
        action_type:
          type: string
        page_url:
          type: string
        page_title:
          type: string
        referrer:
          type: string
        screen_width:
          type: integer
          format: int32
        screen_height:
          type: integer
          format: int32
        client_build_version:
          type: string
        ui_action_data:
          type: object
          additionalProperties:
            type: object
    DWRResponseBase:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
    UsageUiActionsResponse:
      type: object
      properties:
        publishedCount:
          type: integer
          format: int32
  securitySchemes:
    bearer-key:
      type: http
      description: JWT token Bearer
      scheme: bearer
      bearerFormat: JWT
