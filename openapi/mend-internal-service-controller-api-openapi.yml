openapi: 3.2.0
info:
  title: Mend Internal Service Controller API
  description: 'Mend''s enhanced SCA API enables automation of workflows in a REST compliant format. The API features:

    + Access for any user with Mend credentials, via a user key available in the user''s profile page in the Mend App.

    + Improved security with a JWT token per organization, which expires every 10 minutes.

    + Added scalability with support for pagination, filtering and sorting search results.

    + Broader functionality available programmatically.

    + New standard API documentation for easy navigation and search.


    **Note:** To help you get started with the Mend SCA API 2.0, we recommend reviewing our onboarding guide -> Getting Started with Mend SCA API 2.0.

    This resource covers initial setup, authentication instructions, and helpful tips to help you successfully begin working with the Mend SCA API 2.0. If you have a dedicated instance of Mend, contact your Mend representative to access this API on your instance.'
  version: 3.0.1
servers:
- url: https://api-saas.mend.io
  description: Generated server url
security:
- bearer-key: []
tags:
- name: internal-service-controller
paths:
  /api/v2.0/internal/service/entities:
    post:
      tags:
      - internal-service-controller
      operationId: getDomainEntities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalServiceDTO'
        required: true
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DomainEntitiesDTO'
      summary: Get domain entities
      x-summary-source: derived
components:
  schemas:
    DomainEntitiesProductDTO:
      type: object
      properties:
        uuid:
          title: Product Uuid
          type: string
          example: 123e4567-e89b-12d3-a456-426655440000
        name:
          title: Product Name
          type: string
          example: Product A
        tags:
          type: array
          items:
            $ref: '#/components/schemas/EntityTagDTO'
        createdAt:
          type: string
          format: date-time
    EntityTagDTO:
      type: object
      properties:
        key:
          title: Entity Tag Key
          type: string
          example: key
        value:
          title: Entity Tag value
          type: string
          example: value
    DomainEntitiesDTO:
      type: object
      properties:
        project:
          $ref: '#/components/schemas/DomainEntitiesProjectDTO'
        product:
          $ref: '#/components/schemas/DomainEntitiesProductDTO'
    InternalServiceDTO:
      type: object
      properties:
        domainUuid:
          type: string
        userUuid:
          type: string
    DomainEntitiesProjectDTO:
      type: object
      properties:
        uuid:
          title: Project UUID
          type: string
          example: 123e4567-e89b-12d3-a456-426655440000
        name:
          title: Project Name
          type: string
          example: Project A
        tags:
          type: array
          items:
            $ref: '#/components/schemas/EntityTagDTO'
        lastScanned:
          title: Last Project Scan Date
          type: string
          format: date-time
        scannedByEmail:
          title: Scanned By
          type: string
          example: jon.snow@mail.com
        scanComment:
          title: Scan Comment
          type: string
          example: Scan comment
        createdAt:
          title: Creation Date
          type: string
          format: date-time
    DWRResponseBase:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
  securitySchemes:
    bearer-key:
      type: http
      description: JWT token Bearer
      scheme: bearer
      bearerFormat: JWT
