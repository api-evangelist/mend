components:
  schemas:
    DWRResponsePageableCollectionDomainConfigurationDTO:
      type: object
      properties:
        additionalData:
          title: Provides insights into endpoint-supported pagination information.
          type: object
          description: '+ **totalItems**: The total count of data points returned in an API response.

            + **isLastPage**: Defines whether the current page represents the conclusion of the API response. When “true”, this signifies you are viewing the last page of the API response. When “false”, this indicates there are further pages remaining.'
          example:
            totalItems: '422'
            isLastPage: 'true'
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
        retVal:
          type: array
          items:
            $ref: '#/components/schemas/DomainConfigurationDTO'
      description: Provides insights into endpoint-supported pagination information
    EntityConfigurationRequestDTO:
      required:
      - entityTokens
      type: object
      properties:
        entityTokens:
          type: array
          items:
            title: Entity Token
            type: string
            description: 'Depending on the value of contextType, this can be:

              + orgToken (org UUID by running Entities - Organization > Get User Organization) or Api Token (from the Mend SCA App: **Integrate** tab > **API Key**).

              + productToken (product UUID (by running Entities - Organization > Get Organization Products) or Product Token (from the Mend SCA App: **Integrate** tab > **Product Token**.

              + projectToken (project UUID by running Entities - Product > Get Product Projects) or project Token (from the Mend SCA App: **Integrate** tab > **Project Token**).'
            example: 123e4567-e89b-12d3-a456-426655440000
    UpdateDefaultConfigurationRequestDTO:
      required:
      - defaultUuid
      type: object
      properties:
        currentUuid:
          title: Current default configuration UUID
          type: string
          example: 123e4567-e89b-12d3-a456-426655440000
        defaultUuid:
          title: New default configuration UUID
          type: string
          example: 123e4567-e89b-12d3-a456-426655440000
    EntityDTO:
      type: object
      properties:
        uuid:
          type: string
        name:
          type: string
    DomainConfigurationRequestDTO:
      required:
      - name
      type: object
      properties:
        name:
          title: Configuration Name
          type: string
          example: Configuration Name A
    MessageDTO:
      type: object
      properties:
        message:
          title: message
          type: string
          example: Success!
    DomainConfigurationDTO:
      type: object
      properties:
        uuid:
          type: string
        namespace:
          type: string
        value:
          type: string
        displayName:
          type: string
        defaultConfig:
          type: boolean
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        id:
          type: integer
          format: int64
    DWRResponseBase:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
  securitySchemes:
    bearer-key:
      type: http
      description: JWT token Bearer
      scheme: bearer
      bearerFormat: JWT
