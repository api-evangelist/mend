openapi: 3.2.0
info:
  title: Mend Findings - Comments API
  description: 'Mend''s enhanced SCA API enables automation of workflows in a REST compliant format. The API features:

    + Access for any user with Mend credentials, via a user key available in the user''s profile page in the Mend App.

    + Improved security with a JWT token per organization, which expires every 10 minutes.

    + Added scalability with support for pagination, filtering and sorting search results.

    + Broader functionality available programmatically.

    + New standard API documentation for easy navigation and search.


    **Note:** To help you get started with the Mend SCA API 2.0, we recommend reviewing our onboarding guide -> Getting Started with Mend SCA API 2.0.

    This resource covers initial setup, authentication instructions, and helpful tips to help you successfully begin working with the Mend SCA API 2.0. If you have a dedicated instance of Mend, contact your Mend representative to access this API on your instance.'
  version: 3.0.1
servers:
- url: https://api-saas.mend.io
  description: Generated server url
security:
- bearer-key: []
tags:
- name: Findings - Comments
paths:
  /api/v3.0/orgs/{orgUuid}/projects/{projectUuid}/findings/{findingUuid}/comments:
    get:
      tags:
      - Findings - Comments
      summary: Get Finding Comments
      description: Returns the comments for a project finding. Supports MQL filtering, pagination, and sort via the standard v3 query parameters (cursor, limit, search, sort); UFS performs the filtering and pagination.
      operationId: getFindingComments
      parameters:
      - name: orgUuid
        in: path
        description: Org UUID (Administration > General)
        required: true
        schema:
          type: string
      - name: projectUuid
        in: path
        description: Project UUID (Administration > Projects)
        required: true
        schema:
          type: string
      - name: findingUuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DWRResponsePageableV3ListCommentDTOV3'
    post:
      tags:
      - Findings - Comments
      summary: Create Finding Comment
      description: Adds a comment to a project finding
      operationId: createFindingComment
      parameters:
      - name: orgUuid
        in: path
        description: Org UUID (Administration > General)
        required: true
        schema:
          type: string
      - name: projectUuid
        in: path
        description: Project UUID (Administration > Projects)
        required: true
        schema:
          type: string
      - name: findingUuid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentBodyV3'
        required: true
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DWRResponseV3CommentDTOV3'
  /api/v3.0/orgs/{orgUuid}/projects/{projectUuid}/findings/{findingUuid}/comments/{commentUuid}:
    delete:
      tags:
      - Findings - Comments
      summary: Delete Finding Comment
      description: Removes a comment from a project finding
      operationId: deleteFindingComment
      parameters:
      - name: orgUuid
        in: path
        description: Org UUID (Administration > General)
        required: true
        schema:
          type: string
      - name: projectUuid
        in: path
        description: Project UUID (Administration > Projects)
        required: true
        schema:
          type: string
      - name: findingUuid
        in: path
        required: true
        schema:
          type: string
      - name: commentUuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DWRResponseV3MessageDTO'
    patch:
      tags:
      - Findings - Comments
      summary: Update Finding Comment
      description: Edits the body of an existing comment
      operationId: updateFindingComment
      parameters:
      - name: orgUuid
        in: path
        description: Org UUID (Administration > General)
        required: true
        schema:
          type: string
      - name: projectUuid
        in: path
        description: Project UUID (Administration > Projects)
        required: true
        schema:
          type: string
      - name: findingUuid
        in: path
        required: true
        schema:
          type: string
      - name: commentUuid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCommentBodyV3'
        required: true
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DWRResponseV3CommentDTOV3'
components:
  schemas:
    CommentDTOV3:
      type: object
      properties:
        uuid:
          type: string
        author:
          $ref: '#/components/schemas/UserInfoDTOV3'
        body:
          type: string
        dynamicFields:
          type: object
          additionalProperties:
            type: object
        createdAt:
          type: string
        updatedAt:
          type: string
        lastEditedBy:
          $ref: '#/components/schemas/UserInfoDTOV3'
        lastEditedAt:
          type: string
    DWRResponsePageableV3ListCommentDTOV3:
      type: object
      properties:
        additionalData:
          title: Provides insights into endpoint-supported pagination information.
          type: object
          description: '+ **totalItems**: The total count of data points returned in an API response.

            '
          example:
            totalItems: '422'
            next: http://someUrl?cursor=3
            cursor: 3
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
        response:
          type: array
          items:
            $ref: '#/components/schemas/CommentDTOV3'
    DWRResponseV3CommentDTOV3:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
        response:
          $ref: '#/components/schemas/CommentDTOV3'
    UpdateCommentBodyV3:
      required:
      - body
      type: object
      properties:
        body:
          maxLength: 2048
          minLength: 0
          pattern: ^[^\u0000-\u0008\u000B-\u001F\u007F-\u009F]*$
          type: string
    DWRResponseV3MessageDTO:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
        response:
          $ref: '#/components/schemas/MessageDTO'
    UserInfoDTOV3:
      required:
      - uuid
      type: object
      properties:
        uuid:
          title: User UUID
          type: string
          example: 123e4567-e89b-12d3-a456-426655440000
        name:
          title: User Name
          type: string
          example: Jon Smith
        email:
          title: User Email
          type: string
          example: jon.smith@mail.com
        userType:
          title: Type Of User
          type: string
          example: REGULAR
          enum:
          - REGULAR
          - SERVICE
          - SCAN_SUMMARY_RECEIVER
        accountStatus:
          title: User Account Status
          type: string
          example: ACTIVE
          enum:
          - ACTIVE
          - INVITED
          - DISABLED
    MessageDTO:
      type: object
      properties:
        message:
          title: message
          type: string
          example: Success!
    CreateCommentBodyV3:
      required:
      - body
      type: object
      properties:
        body:
          maxLength: 2048
          minLength: 1
          pattern: ^[^\u0000-\u0008\u000B-\u001F\u007F-\u009F]*$
          type: string
        dynamicFields:
          type: object
          additionalProperties:
            type: object
    DWRResponseBase:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
  securitySchemes:
    bearer-key:
      type: http
      description: JWT token Bearer
      scheme: bearer
      bearerFormat: JWT
