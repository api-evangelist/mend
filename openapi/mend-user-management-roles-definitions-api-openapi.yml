            - SUPPRESSIONS__SUPPRESS_AI
            - SUPPRESSIONS__SUPPRESS_ALL
            - JIRA_TICKET__SECURITY_CREATE
            - REVIEW_STATUS__UPDATE
            - SEVERITY__UPDATE
            - COMMENT__ADD
            - RED_TEAMING__VIEW
            - RED_TEAMING__RUN_CAMPAIGN
            - RED_TEAMING__MANAGE_TARGETS
            - RED_TEAMING__DELETE_TARGET
            - RED_TEAMING__MANAGE_SETTINGS
            - RED_TEAMING__SUPPRESS_FINDINGS
    DWRResponseV3ListRoleDefinitionDTOV3:
      type: object
