components:
  schemas:
    RoleDefinitionCapabilitiesDTOV3:
      type: object
      properties:
        capabilities:
          type: array
          items:
            type: string
    DWRResponseV3ListRoleCapabilityDTOV3:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
        response:
          type: array
          items:
            $ref: '#/components/schemas/RoleCapabilityDTOV3'
    RoleDefinitionDTOV3:
      type: object
      properties:
        uuid:
          type: string
        name:
          type: string
        description:
          type: string
        type:
          type: string
        scopeType:
          type: string
          enum:
          - organization
          - application
          - project
          - account
          - unsupported
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        originalRole:
          type: string
        capabilities:
          type: array
          items:
            type: string
    RoleDefinitionRequestDTOV3:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        capabilities:
          type: array
          items:
            type: string
    RoleCapabilityDTOV3:
      type: object
      properties:
        id:
          type: string
          enum:
          - SCANS__UPDATE_PROJECTS
          - SCANS__CREATE_ENTITIES
          - WORKFLOWS__VIEW
          - WORKFLOWS__WRITE
          - WORKFLOWS__DELETE
          - WORKFLOWS__UPDATE_SLA
          - SUPPRESSIONS__REQUEST_CODE
          - SUPPRESSIONS__MANAGE_CODE
          - SUPPRESSIONS__MANAGE_CODE_LOW
          - SUPPRESSIONS__MANAGE_CODE_MEDIUM
          - SUPPRESSIONS__MANAGE_CODE_HIGH
          - SUPPRESSIONS__SUPPRESS_CN
          - SUPPRESSIONS__SUPPRESS_SCA
          - SUPPRESSIONS__SUPPRESS_AI
          - SUPPRESSIONS__SUPPRESS_ALL
          - JIRA_TICKET__SECURITY_CREATE
          - REVIEW_STATUS__UPDATE
          - SEVERITY__UPDATE
          - COMMENT__ADD
          - RED_TEAMING__VIEW
          - RED_TEAMING__RUN_CAMPAIGN
          - RED_TEAMING__MANAGE_TARGETS
          - RED_TEAMING__DELETE_TARGET
          - RED_TEAMING__MANAGE_SETTINGS
          - RED_TEAMING__SUPPRESS_FINDINGS
        name:
          type: string
        category:
          type: string
        subcategory:
          type: string
        implies:
          type: array
          items:
            type: string
            enum:
            - SCANS__UPDATE_PROJECTS
            - SCANS__CREATE_ENTITIES
            - WORKFLOWS__VIEW
            - WORKFLOWS__WRITE
            - WORKFLOWS__DELETE
            - WORKFLOWS__UPDATE_SLA
            - SUPPRESSIONS__REQUEST_CODE
