        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDTO'
      summary: Activate automation workflow 1
      x-summary-source: derived
  /api/v2.0/orgs/{orgToken}/automation/workflows/{workflowUuid}:
    get:
      tags:
      - automation-engine-controller
      operationId: getAutomationWorkflow_1
      parameters:
      - name: orgToken
        in: path
        description: 'org UUID (by running Entities - Organization > Get User Organizations) or API Key (from the Mend SCA App: **Integrate** tab > **API Key**).'
        required: true
        schema:
          type: string
      - name: workflowUuid
        in: path
        required: true
