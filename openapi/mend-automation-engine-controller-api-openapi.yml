          type: boolean
    ActionValueEmailJsonDTO:
      type: object
      allOf:
      - $ref: '#/components/schemas/AutomationActionValueJsonDTO'
      - type: object
        properties:
          selectedValues:
            type: string
          selectedLabelValueDTOs:
            type: array
            items:
              $ref: '#/components/schemas/LabelValueDTO'
          context:
            type: string
          newFindingOnly:
            type: boolean
          groups:
            type: array
            items:
              type: string
          deliveryFrequency:
            type: string
    AutomationActionValueJsonDTO:
      type: object
      properties:
        valueType:
          type: string
      discriminator:
        propertyName: valueType
    ActionValueCreateViolationJsonDTO:
      type: object
      allOf:
      - $ref: '#/components/schemas/AutomationActionValueJsonDTO'
      - type: object
        properties:
          failPipeline:
            type: boolean
          risk:
            type: integer
            format: int32
          slaRelativeDays:
            type: integer
            format: int32
          updateExisting:
            type: boolean
    AutomationTriggerDTO:
      type: object
      properties:
        uuid:
          type: string
        eventKey:
          type: string
        engineType:
          type: string
        scopeType:
          type: string
        scopeValue:
          type: string
        orgUuid:
          type: string
        appUuid:
          type: string
        projectUuid:
          type: string
        enabled:
          type: boolean
    AutomationConfigurationTriggerDTO:
      type: object
      properties:
        eventKey:
          type: string
        eventDisplayName:
          type: string
        group:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/AutomationConfigurationTriggerFieldDTO'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/AutomationConfigurationActionDTO'
        creatable:
          type: boolean
        supportedWorkflowTypes:
          type: array
          items:
            type: string
            enum:
            - SECURITY
            - LEGAL
            - OPERATIONAL
    AutomationConfigurationLogicalOperatorDTO:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
  securitySchemes:
    bearer-key:
      type: http
      description: JWT token Bearer
      scheme: bearer
      bearerFormat: JWT
