  /api/v2.0/orgs/{orgToken}/automation/configuration/cwe-types:
    get:
      tags:
      - automation-engine-controller
      operationId: getAutomationCWETypes
      parameters:
      - name: orgToken
        in: path
        description: 'org UUID (by running Entities - Organization > Get User Organizations) or API Key (from the Mend SCA App: **Integrate** tab > **API Key**).'
        required: true
        schema:
          type: string
      - name: scope
        in: query
        description: global for the CWE types every organization shares only, e.g. for an account-level workflow; without it, the organization's own CWE types are included. Any other value is refused.
        required: false
        schema:
          type: string
          enum:
          - global
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
