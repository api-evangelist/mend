components:
  schemas:
    AutomationConditionUpdatePublicDTO:
      type: object
      properties:
        uuid:
          type: string
        leftOperatorName:
          type: string
        factProperty:
          type: string
        factComparatorName:
          type: string
        factValue:
          type: array
          items:
            $ref: '#/components/schemas/LabelValueDTO'
        enabled:
          type: boolean
        group:
          type: string
        displayName:
          type: string
    AutomationConfigurationDTO:
      type: object
      properties:
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/AutomationConfigurationTriggerDTO'
        availableComparatorsByOperandType:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/AutomationConfigurationComparatorDTO'
        logicalOperators:
          type: array
          items:
            $ref: '#/components/schemas/AutomationConfigurationLogicalOperatorDTO'
        scopeFields:
          type: array
          items:
            $ref: '#/components/schemas/AutomationConfigurationTriggerFieldDTO'
        additionalScopeFields:
          type: array
          items:
            $ref: '#/components/schemas/AutomationConfigurationTriggerFieldDTO'
        conditionGroupLimit:
          type: integer
          format: int32
        scopeLimit:
          type: integer
          format: int32
        conditionLimit:
          type: integer
          format: int32
        actionLimit:
          type: integer
          format: int32
        separator:
          type: string
        newWorkflowLevel:
          type: string
    AutomationActionDTO:
      type: object
      properties:
        uuid:
          type: string
        actionType:
          type: string
        flavor:
          type: string
        value:
          oneOf:
          - $ref: '#/components/schemas/AutomationActionValueJsonDTO'
          - $ref: '#/components/schemas/ActionValueCreateViolationJsonDTO'
          - $ref: '#/components/schemas/ActionValueEmailJsonDTO'
          - $ref: '#/components/schemas/AutomationActionValueJsonDefaultDTO'
          - $ref: '#/components/schemas/AutomationActionValueJsonTextDTO'
        priority:
          type: integer
          format: int32
        disabled:
          type: string
        exclusive:
          type: boolean
    CWETypesDTO:
      type: object
      properties:
        value:
          type: string
        title:
          type: string
    AutomationWorkflowTemplateExplanationDTO:
      type: object
      properties:
        header:
          type: string
        fields:
          type: array
          items:
            type: string
        footer:
          type: string
    AutomationConfigurationTriggerFieldDTO:
      type: object
      properties:
        displayName:
          type: string
        fieldType:
          type: string
        group:
          type: string
        exclusive:
          type: boolean
        options:
          type: array
          items:
            $ref: '#/components/schemas/LabelValueDTO'
        publicUniqueKey:
          type: string
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/ScopeTriggersDTO'
        exclusionId:
          type: string
        allowedWorkflowTypes:
          type: array
          items:
            type: string
            enum:
            - SECURITY
            - LEGAL
            - OPERATIONAL
    ScopeTriggersDTO:
      type: object
      properties:
        eventKey:
          type: string
        availableComparators:
          type: array
          items:
            type: string
    MessageDTO:
      type: object
      properties:
        message:
          title: message
          type: string
          example: Success!
    AutomationWorkflowSummaryDTO:
      type: object
      properties:
        uuid:
          type: string
        updatedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        owner:
          type: string
        ownerName:
          type: string
        ownerEmail:
          type: string
        name:
          type: string
        description:
          type: string
        priority:
          type: integer
          format: int32
        trigger:
          $ref: '#/components/schemas/AutomationTriggerDTO'
        enabled:
          type: boolean
        scopeConditionGroups:
          type: array
          items:
            $ref: '#/components/schemas/AutomationConditionGroupDTO'
        workflowLevel:
          type: string
        scope:
          type: string
        orgAdminCanActivate:
          type: boolean
        canEdit:
          type: boolean
        canDelete:
          type: boolean
        canClone:
          type: boolean
        workflowType:
          type: string
          enum:
          - SECURITY
          - LEGAL
          - OPERATIONAL
        hasJiraAction:
          type: boolean
        orgJiraConfigured:
          type: boolean
    DWRResponseBase:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
    AutomationWorkflowRequestDTO:
      type: object
      properties:
        workflow:
          $ref: '#/components/schemas/AutomationWorkflowDTO'
        trigger:
          $ref: '#/components/schemas/AutomationTriggerDTO'
        conditionsGroups:
          type: array
          items:
            $ref: '#/components/schemas/AutomationConditionGroupDTO'
        scopeConditionGroups:
          type: array
          items:
            $ref: '#/components/schemas/AutomationConditionGroupDTO'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/AutomationActionDTO'
        canEdit:
          type: boolean
    AutomationConfigurationActionDTO:
      type: object
      properties:
        actionType:
          type: string
        flavor:
          type: string
        displayName:
          type: string
        data:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/LabelValueDTO'
        disabled:
          type: string
    AutomationActionValueJsonTextDTO:
      type: object
      allOf:
      - $ref: '#/components/schemas/AutomationActionValueJsonDTO'
      - type: object
        properties:
          selectedValues:
            type: string
          context:
            type: string
    LabelValueDTO:
      type: object
      properties:
        label:
          type: string
        value:
          type: object
        additionalValue:
          type: object
    AutomationConditionGroupUpdatePublicDTO:
      type: object
      properties:
        uuid:
          type: string
        leftOperatorName:
          type: string
        enabled:
          type: boolean
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/AutomationConditionUpdatePublicDTO'
    AutomationWorkflowUpdateRequestDTO:
      type: object
      properties:
        trigger:
          $ref: '#/components/schemas/AutomationTriggerDTO'
        workflow:
          $ref: '#/components/schemas/AutomationWorkflowDTO'
        scopeConditionGroups:
          type: array
          items:
            $ref: '#/components/schemas/AutomationConditionGroupUpdatePublicDTO'
        conditionsGroups:
          type: array
          items:
            $ref: '#/components/schemas/AutomationConditionGroupUpdatePublicDTO'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/AutomationActionDTO'
        templateUuid:
          type: string
    AutomationActionValueJsonDefaultDTO:
      type: object
      allOf:
      - $ref: '#/components/schemas/AutomationActionValueJsonDTO'
      - type: object
        properties:
          selectedValues:
            type: string
          selectedLabelValueDTOs:
            type: array
            items:
              $ref: '#/components/schemas/LabelValueDTO'
          context:
            type: string
    AutomationConditionGroupDTO:
      type: object
      properties:
        uuid:
          type: string
        leftOperatorName:
          type: string
        priority:
          type: integer
          format: int32
        enabled:
          type: boolean
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/AutomationConditionDTO'
    DWRResponseListAutomationWorkflowTemplateDTO:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
        retVal:
          type: array
          items:
            $ref: '#/components/schemas/AutomationWorkflowTemplateDTO'
    AutomationConfigurationComparatorDTO:
      type: object
      properties:
        name:
          type: string
        displayName:
          type: string
        type:
          type: string
        operator:
          type: string
        inputFieldsCount:
          type: integer
          format: int32
    AutomationWorkflowResponseDTO:
      type: object
      properties:
        message:
          type: string
        workflows:
          type: array
          items:
            $ref: '#/components/schemas/AutomationWorkflowRequestDTO'
    DWRResponseListAutomationWorkflowSummaryDTO:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
        retVal:
          type: array
          items:
            $ref: '#/components/schemas/AutomationWorkflowSummaryDTO'
    AutomationWorkflowTemplateDTO:
      type: object
      properties:
        workflow:
          $ref: '#/components/schemas/AutomationWorkflowDTO'
        trigger:
          $ref: '#/components/schemas/AutomationTriggerDTO'
        conditionsGroups:
          type: array
          items:
            $ref: '#/components/schemas/AutomationConditionGroupDTO'
        scopeConditionGroups:
          type: array
          items:
            $ref: '#/components/schemas/AutomationConditionGroupDTO'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/AutomationActionDTO'
        canEdit:
          type: boolean
        uuid:
          type: string
        engineType:
          type: string
        category:
          type: string
        displayName:
          type: string
        tooltip:
          type: string
        explanation:
          $ref: '#/components/schemas/AutomationWorkflowTemplateExplanationDTO'
        isBlank:
          type: boolean
    AutomationConditionDTO:
      type: object
      properties:
        uuid:
          type: string
        leftOperatorName:
          type: string
        factProperty:
          type: string
        factComparatorName:
          type: string
        factValue:
          type: array
          items:
            $ref: '#/components/schemas/LabelValueDTO'
        factValueString:
          type: string
        priority:
          type: integer
          format: int32
        enabled:
          type: boolean
        group:
          type: string
        displayName:
          type: string
    AutomationWorkflowDTO:
      type: object
      properties:
        uuid:
          type: string
        owner:
          type: string
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        workflowLevel:
          type: string
        workflowType:
          type: string
          enum:
