          type: string
          example: www.gitlabServer
        webhookSecret:
          title: Git Web Hook Secret
          type: string
        accessToken:
          title: Git Lab Access Token
          type: string
    DWRResponseV3ListIntegrationDTOV3:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
