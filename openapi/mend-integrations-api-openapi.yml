      tags:
      - Integrations
      summary: Get organizations Wiz integration
      description: Get organizations Wiz integration encrypted credentials
      operationId: getWizIntegration
      parameters:
      - name: orgToken
        in: path
        description: 'org UUID (by running Entities - Organization > Get User Organizations) or API Key (from the Mend SCA App: **Integrate** tab > **API Key**).'
        required: true
        schema:
          type: string
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
