openapi: 3.2.0
info:
  title: Mend User Notifications API
  description: 'Mend''s enhanced SCA API enables automation of workflows in a REST compliant format. The API features:

    + Access for any user with Mend credentials, via a user key available in the user''s profile page in the Mend App.

    + Improved security with a JWT token per organization, which expires every 10 minutes.

    + Added scalability with support for pagination, filtering and sorting search results.

    + Broader functionality available programmatically.

    + New standard API documentation for easy navigation and search.


    **Note:** To help you get started with the Mend SCA API 2.0, we recommend reviewing our onboarding guide -> Getting Started with Mend SCA API 2.0.

    This resource covers initial setup, authentication instructions, and helpful tips to help you successfully begin working with the Mend SCA API 2.0. If you have a dedicated instance of Mend, contact your Mend representative to access this API on your instance.'
  version: 3.0.1
servers:
- url: https://api-saas.mend.io
  description: Generated server url
security:
- bearer-key: []
tags:
- name: User Notifications
paths:
  /api/v3.0/notifications/{notificationUuid}:
    get:
      tags:
      - User Notifications
      summary: Get User Notification
      description: Returns a single notification for the current user
      operationId: getUserNotification
      parameters:
      - name: notificationUuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DWRResponseV3NotificationDTOV3'
    patch:
      tags:
      - User Notifications
      summary: Update User Notification
      description: Updates a notification for the current user
      operationId: updateUserNotification
      parameters:
      - name: notificationUuid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserNotificationRequestDTOV3'
        required: true
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DWRResponseV3NotificationDTOV3'
  /api/v3.0/notifications:
    get:
      tags:
      - User Notifications
      summary: Get User Notifications
      description: Returns a list of user notifications (paginated)
      operationId: getUserNotifications
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DWRResponsePageableV3ListNotificationDTOV3'
components:
  schemas:
    NotificationDTOV3:
      type: object
      properties:
        uuid:
          type: string
          description: Notification UUID
        category:
          type: string
          description: Notification category
          example: CRITICAL_SECURITY_EVENT
        data:
          $ref: '#/components/schemas/JsonNode'
        priority:
          type: integer
          description: Priority level (0-3)
          format: int32
          example: 3
        priorityName:
          type: string
          description: Priority name
          example: CRITICAL
        orgUuid:
          type: string
          description: Organization UUID (null for global notifications)
        createdAt:
          type: string
          description: Creation timestamp
          format: date-time
          example: '2026-03-11T00:00:00Z'
        expiresAt:
          type: string
          description: Expiration timestamp
          format: date-time
          example: '2026-03-11T00:00:00Z'
        status:
          type: string
          description: Notification status. One of { 'READ', 'UNREAD' }
          example: UNREAD
      description: In-app Notification
    DWRResponseV3NotificationDTOV3:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
        response:
          $ref: '#/components/schemas/NotificationDTOV3'
    DWRResponsePageableV3ListNotificationDTOV3:
      type: object
      properties:
        additionalData:
          title: Provides insights into endpoint-supported pagination information.
          type: object
          description: '+ **totalItems**: The total count of data points returned in an API response.

            '
          example:
            totalItems: '422'
            next: http://someUrl?cursor=3
            cursor: 3
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
        response:
          type: array
          items:
            $ref: '#/components/schemas/NotificationDTOV3'
    UpdateUserNotificationRequestDTOV3:
      type: object
      properties:
        status:
          type: string
    DWRResponseBase:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
    JsonNode:
      type: object
  securitySchemes:
    bearer-key:
      type: http
      description: JWT token Bearer
      scheme: bearer
      bearerFormat: JWT
