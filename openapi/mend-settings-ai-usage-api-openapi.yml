components:
  schemas:
    DWRResponseBase:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
    CodeFindingsTriageDTO:
      type: object
      properties:
        aiCodeFindingsTriageConsent:
          type: boolean
    AgenticDetectionEngineDTO:
      type: object
      properties:
        agenticDetectionEngineConsent:
          type: boolean
    PlatformAiAssistantDTO:
      type: object
      properties:
        platformAiAssistantConsent:
          type: boolean
    ProjectClassificationDTO:
      type: object
      properties:
        projectClassificationConsent:
          type: boolean
    DWRResponseMessageDTO:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
        retVal:
          $ref: '#/components/schemas/MessageDTO'
    MessageDTO:
      type: object
      properties:
        message:
          title: message
          type: string
          example: Success!
    CodeScanCustomizationDTO:
      type: object
      properties:
        codeScanCustomizationEnabled:
          type: boolean
    AIUsageDTO:
      type: object
      properties:
        aiUsageEnabled:
          type: boolean
  securitySchemes:
    bearer-key:
      type: http
      description: JWT token Bearer
      scheme: bearer
      bearerFormat: JWT
