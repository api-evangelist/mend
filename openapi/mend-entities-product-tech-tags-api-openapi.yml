openapi: 3.2.0
info:
  title: Mend Entities - Product Tech Tags API
  description: 'Mend''s enhanced SCA API enables automation of workflows in a REST compliant format. The API features:

    + Access for any user with Mend credentials, via a user key available in the user''s profile page in the Mend App.

    + Improved security with a JWT token per organization, which expires every 10 minutes.

    + Added scalability with support for pagination, filtering and sorting search results.

    + Broader functionality available programmatically.

    + New standard API documentation for easy navigation and search.


    **Note:** To help you get started with the Mend SCA API 2.0, we recommend reviewing our onboarding guide -> Getting Started with Mend SCA API 2.0.

    This resource covers initial setup, authentication instructions, and helpful tips to help you successfully begin working with the Mend SCA API 2.0. If you have a dedicated instance of Mend, contact your Mend representative to access this API on your instance.'
  version: 3.0.1
servers:
- url: https://api-saas.mend.io
  description: Generated server url
security:
- bearer-key: []
tags:
- name: Entities - Product Tech Tags
paths:
  /api/v2.0/products/{productIdentifier}/techTags/recalculate:
    post:
      tags:
      - Entities - Product Tech Tags
      summary: Recalculate tech tags of libraries of projects of a product
      description: Recalculate tech tags assigned to libraries of projects of a product.
      operationId: recalculateTechTagsByProduct
      parameters:
      - name: productIdentifier
        in: path
        description: 'product UUID (by running Entities - Organization > Get Organization Products) or Product Token (from the Mend SCA App: **Integrate** tab > **Product Token**).'
        required: true
        schema:
          type: string
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDTO'
  /api/v2.0/products/{productIdentifier}/techTags:
    get:
      tags:
      - Entities - Product Tech Tags
      summary: Get tech tags of libraries of projects of a product
      description: Get tech tags assigned to libraries of projects of a product.
      operationId: getTechTagsByProduct
      parameters:
      - name: productIdentifier
        in: path
        description: 'product UUID (by running Entities - Organization > Get Organization Products) or Product Token (from the Mend SCA App: **Integrate** tab > **Product Token**).'
        required: true
        schema:
          type: string
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DomainTechTagDTO'
components:
  schemas:
    DomainTechTagDTO:
      type: object
      properties:
        techTag:
          type: string
        count:
          type: integer
          format: int32
        libraries:
          uniqueItems: true
          type: array
          items:
            type: string
        projectNames:
          uniqueItems: true
          type: array
          items:
            type: string
        projectUuids:
          uniqueItems: true
          type: array
          items:
            type: string
    DWRResponseBase:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
    MessageDTO:
      type: object
      properties:
        message:
          title: message
          type: string
          example: Success!
  securitySchemes:
    bearer-key:
      type: http
      description: JWT token Bearer
      scheme: bearer
      bearerFormat: JWT
