components:
  schemas:
    RiskReportExportDTO:
      type: object
      properties:
        name:
          type: string
        format:
          type: string
          description: Output file format. The Risk report only supports pdf.
          example: pdf
          enum:
          - pdf
        sendEmailNotification:
          type: boolean
        labelsUuidList:
          type: array
          description: 'List of label UUIDs used to scope the report. Pass an empty array ([]) to apply no label filtering (the report then covers the full scope). Note: the placeholder value "string" shown in the example schema is not a valid UUID — passing it (or any non-existent label UUID) matches no labels and produces an empty report.'
          example: []
          items:
            type: string
            description: 'List of label UUIDs used to scope the report. Pass an empty array ([]) to apply no label filtering (the report then covers the full scope). Note: the placeholder value "string" shown in the example schema is not a valid UUID — passing it (or any non-existent label UUID) matches no labels and produces an empty report.'
            example: '[]'
        excludeInactiveProjects:
          type: boolean
        projectUuids:
          type: array
          items:
            type: string
        exportMode:
          type: string
          description: Export mode. "split" (default) produces a ZIP (PDF summary + Excel CVE detail). "fullPdf" produces a single PDF, subject to a project-count threshold.
          example: split
          enum:
          - split
          - fullPdf
    ReportExportProcessDTO:
      type: object
      properties:
        uuid:
          type: string
        name:
          type: string
        scopeUuid:
          type: string
        scopeName:
          type: string
        subScopes:
          type: array
          items:
            $ref: '#/components/schemas/EntityTreeDTO'
        title:
          type: string
        reportType:
          type: string
          enum:
          - attribution
          - inventory
          - vulnerabilities
          - securityAlerts
          - sbom
          - Cbom
          - securityAlertsLibrary
          - Compliance
          - Findings
          - Suppressions
          - Resolved
          - spdx
          - spdx_2_3
          - cycloneDX
          - cycloneDX_1_5
          - cycloneDX_1_6
          - dueDiligence
          - unknown
          - imgAttribution
          - imgDueDiligence
          - imgSpdx
          - imgSpdx_2_3
          - imgCycloneDX
          - imgCycloneDX_1_5
          - aiInventory
          - aiFindings
          - aiBom
          - aiEntities
          - conversationalSystemPrompts
          - imgCycloneDX_1_6
          - risk
          - users
          - zeroDayCatalog
          - activityLog
          - unifiedFindings
        format:
          type: string
          enum:
          - json
          - html
          - unknown
          - xml
          - excel
          - yaml
          - pdf
          - tv
          - rdf
          - csv
          - sarif
          - text
        scopeType:
          type: string
          enum:
          - organization
          - product
          - project
          - unsupported
          - account
        scopeUuidList:
          type: array
          items:
            type: string
        projectUuids:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
          - PENDING
          - IN_PROGRESS
          - FAILED
          - FAILURE
          - SUCCESS
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        sendEmailNotification:
          type: boolean
        labelsUuidList:
          type: array
          items:
            type: string
        includeVulnerabilities:
          type: boolean
        excludeInactiveProjects:
          type: boolean
    AttributionReportExportDTO:
      type: object
      properties:
        name:
          type: string
        format:
          type: string
          description: Output file format. The Attribution report supports json, html and text.
          example: json
          enum:
          - json
          - html
          - text
        sendEmailNotification:
          type: boolean
        labelsUuidList:
          type: array
          description: 'List of label UUIDs used to scope the report. Pass an empty array ([]) to apply no label filtering (the report then covers the full scope). Note: the placeholder value "string" shown in the example schema is not a valid UUID — passing it (or any non-existent label UUID) matches no labels and produces an empty report.'
          example: []
          items:
            type: string
            description: 'List of label UUIDs used to scope the report. Pass an empty array ([]) to apply no label filtering (the report then covers the full scope). Note: the placeholder value "string" shown in the example schema is not a valid UUID — passing it (or any non-existent label UUID) matches no labels and produces an empty report.'
            example: '[]'
        excludeInactiveProjects:
          type: boolean
        projectUuids:
          type: array
          items:
            type: string
        licenses:
          type: array
          items:
            type: string
        primaryAttribute:
          type: string
        library:
          type: string
        groupBy:
          type: string
        header:
          type: string
        title:
          type: string
        footer:
          type: string
        licenseReference:
          type: string
        licenseTextPlacement:
