        groupByOrDefault:
          type: string
        licenseReferenceOrDefault:
          type: string
        licenseTextPlacementOrDefault:
          type: string
        selectedColumnsOrDefaultString:
          type: string
    CreateProjectSbomReportDTOReport:
      type: object
      properties:
        name:
          type: string
        format:
          type: string
          enum:
          - json
          - html
          - unknown
          - xml
          - excel
          - yaml
          - pdf
          - tv
          - rdf
          - csv
          - sarif
          - text
        sendEmailNotification:
          type: boolean
        reportType:
          type: string
          description: SBOM report type. Only SPDX and CycloneDX variants are valid for this endpoint.
          example: spdx
          enum:
          - attribution
          - inventory
          - vulnerabilities
          - securityAlerts
          - sbom
          - Cbom
          - securityAlertsLibrary
          - Compliance
          - Findings
          - Suppressions
          - Resolved
          - spdx
          - spdx_2_3
          - cycloneDX
          - cycloneDX_1_5
          - cycloneDX_1_6
          - dueDiligence
          - unknown
          - imgAttribution
          - imgDueDiligence
          - imgSpdx
          - imgSpdx_2_3
          - imgCycloneDX
          - imgCycloneDX_1_5
          - aiInventory
          - aiFindings
          - aiBom
          - aiEntities
          - conversationalSystemPrompts
          - imgCycloneDX_1_6
          - risk
          - users
          - zeroDayCatalog
          - activityLog
          - unifiedFindings
          - spdx
          - spdx_2_3
          - cycloneDX
          - cycloneDX_1_5
          - cycloneDX_1_6
        maxDepthLevel:
          maximum: 4
          minimum: 1
          type: integer
          description: Maximum depth level of the dependency tree to include in the report. Applies to CycloneDX variants only and must be between 1 and 4; values outside this range (including 0) are rejected with a 400 error. Ignored for SPDX variants.
          format: int32
          example: 1
        includeVulnerabilities:
          type: boolean
        isMlBomReport:
          type: boolean
          description: When true, generates an ML-BOM (AI/ML Bill of Materials) that includes only machine-learning model components. If the selected scope contains no ML/AI model components, the generated report will be empty (for CycloneDX/SPDX this yields an empty ZIP). Defaults to false.
          example: false
        componentGranularity:
          type: string
          description: 'Component granularity: ''library'' (default) or ''file'' for source-file-level coverage'
          example: library
          enum:
          - library
          - file
        reportStructure:
          type: string
          description: How the report is split over files. A project scope always produces one file, so 'PER_PROJECT' is the only accepted value here; 'AGGREGATED' is rejected with a 400 error.
          example: PER_PROJECT
          enum:
          - PER_PROJECT
          - AGGREGATED
          - PER_PROJECT
    EntityTreeDTO:
      type: object
      properties:
        uuid:
          type: string
        name:
          type: string
        scopeUuid:
          type: string
        scopeName:
          type: string
    VulnerabilitiesReportExportDTO:
      type: object
      properties:
        name:
          type: string
        format:
          type: string
          description: Output file format. The Vulnerabilities report supports excel, csv, json and xml.
          example: excel
          enum:
          - json
          - html
          - unknown
          - xml
