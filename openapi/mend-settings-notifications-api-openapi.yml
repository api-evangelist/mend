openapi: 3.2.0
info:
  title: Mend Settings - Notifications API
  description: 'Mend''s enhanced SCA API enables automation of workflows in a REST compliant format. The API features:

    + Access for any user with Mend credentials, via a user key available in the user''s profile page in the Mend App.

    + Improved security with a JWT token per organization, which expires every 10 minutes.

    + Added scalability with support for pagination, filtering and sorting search results.

    + Broader functionality available programmatically.

    + New standard API documentation for easy navigation and search.


    **Note:** To help you get started with the Mend SCA API 2.0, we recommend reviewing our onboarding guide -> Getting Started with Mend SCA API 2.0.

    This resource covers initial setup, authentication instructions, and helpful tips to help you successfully begin working with the Mend SCA API 2.0. If you have a dedicated instance of Mend, contact your Mend representative to access this API on your instance.'
  version: 3.0.1
servers:
- url: https://api-saas.mend.io
  description: Generated server url
security:
- bearer-key: []
tags:
- name: Settings - Notifications
paths:
  /api/v2.0/orgs/{orgToken}/settings/notifications:
    get:
      tags:
      - Settings - Notifications
      summary: Get Organization Notifications Settings
      description: Returns an organization's email notification settings in the event of changes to inventory, vulnerability alerts and requests
      operationId: getOrgNotificationsSettings
      parameters:
      - name: orgToken
        in: path
        description: 'org UUID (by running Entities - Organization > Get User Organizations) or API Key (from the Mend SCA App: **Integrate** tab > **API Key**).'
        required: true
        schema:
          type: string
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationsSettingsDTO'
    put:
      tags:
      - Settings - Notifications
      summary: Update Organization Notifications Settings
      description: Updates an organization's email notification settings in the event of changes to inventory, vulnerability alerts and requests
      operationId: updateOrgNotificationsSettings
      parameters:
      - name: orgToken
        in: path
        description: 'org UUID (by running Entities - Organization > Get User Organizations) or API Key (from the Mend SCA App: **Integrate** tab > **API Key**).'
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationsSettingsDTO'
        required: true
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationsSettingsDTO'
components:
  schemas:
    NotificationsSettingsDTO:
      type: object
      properties:
        rules:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/EmailFrequencyRuleDTO'
            - $ref: '#/components/schemas/NotificationRuleDTO'
    BaseNotificationRuleDTO:
      required:
      - active
      - type
      type: object
      properties:
        active:
          title: Rule Status
          type: boolean
          example: true
        type:
          type: string
      discriminator:
        propertyName: type
      oneOf:
      - $ref: '#/components/schemas/EmailFrequencyRuleDTO'
      - $ref: '#/components/schemas/NotificationRuleDTO'
    EmailFrequencyRuleDTO:
      required:
      - active
      type: object
      description: 'type: EMAIL_FREQUENCY'
      allOf:
      - $ref: '#/components/schemas/BaseNotificationRuleDTO'
      - type: object
        properties:
          notificationFrequency:
            title: Email Frequency
            type: string
            enum:
            - WEEKLY
            - MONTHLY
    NotificationRuleDTO:
      required:
      - active
      - notificationType
      type: object
      description: 'type: NOTIFICATION_RULE'
      allOf:
      - $ref: '#/components/schemas/BaseNotificationRuleDTO'
      - type: object
        properties:
          notificationType:
            title: Notification Type
            type: string
            enum:
            - NOTIFY_ON_NEW_TASK
            - NOTIFY_ON_PROJECT_SETUP_COMPLETION
            - OPERATION_NOTIFICATIONS
            - NOTIFY_ON_REQUESTS_CLOSED_BY_POLICY
    DWRResponseBase:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
  securitySchemes:
    bearer-key:
      type: http
      description: JWT token Bearer
      scheme: bearer
      bearerFormat: JWT
x-provenance:
  method: harvested
  publisher: Mend
  source: https://api-saas.mend.io/v3/api-docs
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
