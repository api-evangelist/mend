openapi: 3.2.0
info:
  title: Mend Application Violations Controller API
  description: 'Mend''s enhanced SCA API enables automation of workflows in a REST compliant format. The API features:

    + Access for any user with Mend credentials, via a user key available in the user''s profile page in the Mend App.

    + Improved security with a JWT token per organization, which expires every 10 minutes.

    + Added scalability with support for pagination, filtering and sorting search results.

    + Broader functionality available programmatically.

    + New standard API documentation for easy navigation and search.


    **Note:** To help you get started with the Mend SCA API 2.0, we recommend reviewing our onboarding guide -> Getting Started with Mend SCA API 2.0.

    This resource covers initial setup, authentication instructions, and helpful tips to help you successfully begin working with the Mend SCA API 2.0. If you have a dedicated instance of Mend, contact your Mend representative to access this API on your instance.'
  version: 3.0.1
servers:
- url: https://api-saas.mend.io
  description: Generated server url
security:
- bearer-key: []
tags:
- name: application-violations-controller
paths:
  /api/v2.0/products/{productToken}/violations/sla:
    put:
      tags:
      - application-violations-controller
      summary: Update Multiple Violation SLA
      description: Updates the SLA of Multiple Application Violating Findings
      operationId: updateMultipleProjectViolationSla_4
      parameters:
      - name: productToken
        in: path
        description: 'product UUID (by running Entities - Organization > Get Organization Products) or Product Token (from the Mend SCA App: **Integrate** tab > **Product Token**).'
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMultipleProjectViolationSlaRequestDTO'
        required: true
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DWRResponseBoolean'
  /api/v2.0/products/{productToken}/violations:
    get:
      tags:
      - application-violations-controller
      summary: Get Application Violating Findings
      description: Returns the violations relates to application
      operationId: getApplicationViolations_1
      parameters:
      - name: productToken
        in: path
        description: 'product UUID (by running Entities - Organization > Get Organization Products) or Product Token (from the Mend SCA App: **Integrate** tab > **Product Token**).'
        required: true
        schema:
          type: string
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DWRResponseListProjectViolationDTO'
components:
  schemas:
    ProjectViolationDTO:
      required:
      - engine
      - findingType
      type: object
      properties:
        uuid:
          type: string
        name:
          type: string
        projectUuid:
          type: string
        projectName:
          type: string
        engine:
          type: string
          description: Type of engine the violation relates to
          example: SCA
          enum:
          - UNIFIED
          - SCA
          - SAST
          - IAC
          - IMG
          - AI
          - DAST
        findingType:
          type: string
          description: Type of finding
          example: SECURITY
          enum:
          - SECURITY
          - LEGAL
          - LIBRARY
        elementUuid:
          type: string
        elementName:
          type: string
        workflowData:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowData'
        risk:
          type: string
          description: 'Risk of the violation. Can be one of: LOW, MEDIUM, HIGH, CRITICAL'
          example: HIGH
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
        sla:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        refId:
          type: string
        violationType:
          type: string
        isProjectActive:
          type: boolean
    DWRResponseListProjectViolationDTO:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
        retVal:
          type: array
          items:
            $ref: '#/components/schemas/ProjectViolationDTO'
    DWRResponseBoolean:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
        retVal:
          type: boolean
    WorkflowData:
      type: object
      properties:
        workflowUuid:
          type: string
        workflowName:
          type: string
        entityUuid:
          type: string
    ProjectViolationIdentifierDTO:
      type: object
      properties:
        findingUuid:
          type: string
        elementUuid:
          type: string
        projectUuid:
          type: string
    UpdateMultipleProjectViolationSlaRequestDTO:
      type: object
      properties:
        date:
          title: Date
          pattern: yyyy-MM-dd
          type: string
          example: 2024/12/31
        identifiers:
          type: array
          items:
            $ref: '#/components/schemas/ProjectViolationIdentifierDTO'
    DWRResponseBase:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
  securitySchemes:
    bearer-key:
      type: http
      description: JWT token Bearer
      scheme: bearer
      bearerFormat: JWT
x-provenance:
  method: harvested
  publisher: Mend
  source: https://api-saas.mend.io/v3/api-docs
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
