          - Library
        libraryType:
          title: Library Type
          type: string
          example: REDHAT_PACKAGE_MODULE
          deprecated: true
        language:
          title: Language
          type: string
          example: REDHAT_PACKAGE_MODULE
        directDependency:
          type: boolean
        rootLibrary:
          title: Root Library
          type: boolean
        references:
          $ref: '#/components/schemas/ComponentReferencesDTO'
        groupId:
          title: Component Name
          type: string
          example: org.springframework.boot
        artifactId:
          title: Component Artifact
          type: string
          example: spring-boot
        version:
          title: Component Version
          type: string
          example: 3.0.5
        path:
          title: path
          type: string
          example: pom.xml
        dependencyFile:
          type: string
        localPath:
          type: string
        dependencyType:
          title: Dependency Type
          type: string
          example: Direct / Transitive
        libraryLocations:
          type: array
          items:
            $ref: '#/components/schemas/LibraryLocationDTO'
    github_com_mend_cloud-native_modules_scanner_model.Package:
      type: object
      properties:
        name:
          type: string
        reachable:
          type: boolean
        type:
          type: string
        version:
          type: string
    LibraryExtraInfoDTO:
      type: object
