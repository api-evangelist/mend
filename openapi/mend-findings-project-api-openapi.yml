      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/common.BaseApiResponseV3'
                - type: object
                  properties:
                    response:
                      $ref: '#/components/schemas/model.BulkStatusUpdate'
        '400':
          description: Bad request - missing required fields, invalid values, or empty array
          content:
            application/json:
              schema:
                type: object
                properties:
                  additionalData:
                    type: object
                    properties:
                      error:
                        type: string
                  response:
                    type: array
                    items: {}
                  supportToken:
                    type: string
        '404':
