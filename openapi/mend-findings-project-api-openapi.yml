components:
  schemas:
    ResourceAuthorDTO:
      type: object
      properties:
        author:
          title: Resource Author
          type: string
          example: The Apache Software Foundation
        authorUrl:
          title: Author URL
          type: string
          example: http://www.apache.org/
    model.FindingSuppressionReason:
      type: string
      enum:
      - Acceptable risk
      - No fix available
      - No risk
      - Ignore
      x-enum-varnames:
      - FindingSuppressionReasonAcceptableRisk
      - FindingSuppressionReasonNoFixAvailable
      - FindingSuppressionReasonNoRisk
      - FindingSuppressionReasonIgnore
    dto.MendResponse-dto_SuccessResponse:
      properties:
        additionalData:
          additionalProperties: true
          type: object
        response:
          $ref: '#/components/schemas/dto.SuccessResponse'
        supportToken:
          type: string
      type: object
    v3.V3ImplementationFindingResponse:
      type: object
      properties:
        snippetUuid:
          type: string
        origin:
          type: string
        implementationType:
          type: string
        snippet:
          type: string
        severity:
          type: string
        totalSeverity:
          type: integer
        criticalSeverity:
          type: integer
        highSeverity:
          type: integer
        mediumSeverity:
          type: integer
        lowSeverity:
          type: integer
        riskFactors:
          type: array
          items:
            type: string
        project:
          $ref: '#/components/schemas/v3.V3ProjectInfo'
        scanUuid:
          type: string
        findings:
          type: array
          items:
            $ref: '#/components/schemas/v3.V3FindingResponse'
    VulnerabilityScoringDTO:
      type: object
      properties:
        score:
          title: Vulnerability Score
          type: number
          format: float
          example: 5
        severity:
          title: Vulnerability Severity
          type: string
          example: MEDIUM
          enum:
          - LOW
          - HIGH
          - MEDIUM
        type:
          title: Vulnerability Score Type
          type: string
          example: CVSS_2
          enum:
          - CVSS_2
          - CVSS_3
        scoreMetadataVector:
          title: Score Metadata Vector
          type: string
          example: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H
        extraData:
          title: Vulnerability Extra Data
          type: object
          additionalProperties:
            title: Vulnerability Extra Data
            type: string
        source:
          title: CVSS Score Source
          type: string
          example: NVD
          enum:
          - NVD
          - MITRE
          - MEND
          - GITHUB
          - OSV
          - VENDOR
          - EUVD
        url:
          title: CVSS Score Source URL
          type: string
          example: https://nvd.nist.gov/vuln/detail/CVE-2021-44228
        converted:
          title: Whether the score was converted between CVSS versions
          type: boolean
          example: false
    DWRResponsePageableV3CollectionLibrarySecurityFindingDTOV3:
      type: object
      properties:
        additionalData:
          title: Provides insights into endpoint-supported pagination information.
          type: object
          description: '+ **totalItems**: The total count of data points returned in an API response.

            '
          example:
            totalItems: '422'
            next: http://someUrl?cursor=3
            cursor: 3
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
        response:
          type: array
          items:
            $ref: '#/components/schemas/LibrarySecurityFindingDTOV3'
    dto.DataFlow:
      properties:
        ageRating:
          description: Between 0 and 10
          type: number
        confidenceRating:
          description: Between 0 and 10
          type: number
        createdTime:
          type: string
        filter:
          $ref: '#/components/schemas/dto.Filter'
        functionCalls:
          items:
            $ref: '#/components/schemas/dto.CallStackItem'
          type: array
        id:
          type: string
        inputFlow:
          items:
            $ref: '#/components/schemas/dto.CallStackItem'
          type: array
        inputKind:
          type: string
        inputSource:
          type: string
        isNew:
          type: boolean
        rating:
          description: Between 0 and 10
          type: number
        sink:
          type: string
        sinkFile:
          type: string
        sinkKind:
          type: string
        sinkLine:
          type: integer
        sinkSnippet:
          type: string
      type: object
    VulnerabilityProfileDTO:
      type: object
      properties:
        name:
          title: Vulnerability Name
          type: string
          example: CVE-2021-42392
        type:
          title: VulnerabilityType
          type: string
          example: WS
          enum:
          - CVE
          - WS
        description:
          title: Vulnerability Description
          type: string
          example: Security vulnerability found in plexus-utils before 3.0.24. XML injection found in XmlWriterUtil.java
        score:
          title: Vulnerability Score
          type: number
          format: float
          example: 5
        severity:
          title: Vulnerability Severity
          type: string
          example: MEDIUM
          enum:
          - HIGH
          - MEDIUM
          - LOW
        publishDate:
          title: Vulnerability Publish Date
          type: string
          format: date-time
        modifiedDate:
          title: Vulnerability Modified Date
          type: string
          format: date-time
        vulnerabilityScoring:
          type: array
          items:
            $ref: '#/components/schemas/VulnerabilityScoringDTO'
        references:
          type: array
          items:
            $ref: '#/components/schemas/VulnerabilityReferenceDTO'
        effectiveInfo:
          $ref: '#/components/schemas/EffectiveVulnerabilityInfoDTO'
        threatAssessment:
          $ref: '#/components/schemas/ThreatAssessmentDTO'
    dto.PatchFinding:
      properties:
        customSeverity:
          description: 'If set, it has to be either <em>High</em>, <em>Medium</em> or <em>Low</em>.

            Case insensitive, all values are converted to have the first letter uppercase and others lowercase, e.g. <em>High</em>.'
          type: string
        origin:
          description: Optional, origin used for telemetry.
          type: string
        reviewed:
          type: boolean
        suppressed:
          type: boolean
        suppressionReason:
          description: Has to be unset or empty if <b>suppressed</b> is not set or if it's false.
          type: string
      type: object
    dto.FindingSharedStep:
      properties:
        endLine:
          type: integer
        file:
          type: string
        kind:
          type: string
        line:
          type: integer
        lineBlame:
          $ref: '#/components/schemas/dto.LineBlame'
        name:
          type: string
        snippet:
          type: string
        startLine:
          type: integer
      type: object
    github_com_mend_cloud-native_modules_scanner_model.SecretFinding:
      type: object
      properties:
        category:
          type: string
          example: AWS
        createdAt:
          type: string
          example: '2020-01-01T00:00:00Z'
        description:
          type: string
          example: AWS Access Key
        endLine:
          type: integer
          example: 35
        filePath:
          type: string
          example: /home/ubuntu/.aws/credentials
        isFromBaseLayer:
          type: integer
          example: 0
        layerId:
          type: integer
          example: 123456
        layerNumber:
          type: integer
          example: 1
        projectName:
          type: string
        ruleId:
          type: string
          example: '123456'
        severity:
          type: string
          example: HIGH
        startLine:
          type: integer
          example: 15
        updatedAt:
          type: string
          example: '2020-01-01T00:00:00Z'
        uuid:
          type: string
          example: c4f93b6d-8236-4d0c-a67b-3978def476a3
    LibraryLocationComponentDTOV3:
      type: object
      properties:
        uuid:
          title: Component UUID
          type: string
          example: 123e4567-e89b-12d3-a456-426655440000
        name:
          title: Component Name
          type: string
          example: dbus-1.10.24-13.el7_6.x86_64.rpm
        description:
          title: Component Description
          type: string
          example: Component description
        componentType:
          title: Component Type
          type: string
          example: Library
