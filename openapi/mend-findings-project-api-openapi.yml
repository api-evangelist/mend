      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/inputs.FindingStatusInputV3'
        description: 'Finding status update request. Required fields: packageUUID. For ''suppressed'' status, reason is also required.'
