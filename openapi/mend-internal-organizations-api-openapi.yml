  /api/v2.0/internal/orgs/expandTestOrganization:
    post:
      tags:
      - Internal Organizations
      summary: Create or Expand Test Organization
      description: Creates or expands a test organization with products, projects, and libraries for testing purposes
      operationId: expandTestOrganization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpandTestOrganizationRequestDTO'
        required: true
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
