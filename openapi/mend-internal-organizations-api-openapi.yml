                items:
                  $ref: '#/components/schemas/InternalDomainDTO'
  /api/v2.0/internal/orgs/{orgUuid}/systemAccess:
    get:
      tags:
      - Internal Organizations
      summary: System Access Organization
      operationId: systemAccessDomain_1
      parameters:
      - name: orgUuid
        in: path
        description: 'org UUID (by running Entities - Organization > Get User Organizations) or API Key (from the Mend SCA App: **Integrate** tab > **API Key**).'
        required: true
        schema:
          type: string
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
