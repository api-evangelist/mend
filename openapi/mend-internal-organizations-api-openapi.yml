                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InternalDomainDTO'
components:
  schemas:
    NumericValueRequestDTO:
      type: object
      properties:
        value:
          type: integer
          format: int32
    ExpandTestOrganizationRequestDTO:
      title: Expand Test Organization Request
      required:
      - maxNumberOfLibraries
      - minNumberOfLibraries
      - numberOfProducts
      - numberOfProjects
      - orgName
      - threads
      type: object
      properties:
        orgName:
          type: string
          description: Name of the test organization to expand or create
          example: my-test-org
        numberOfProducts:
          minimum: 1
          type: integer
          description: Number of products to create
          format: int32
          example: 3
        numberOfProjects:
          minimum: 1
          type: integer
          description: Number of projects to create
          format: int32
          example: 10
        minNumberOfLibraries:
          minimum: 1
          type: integer
          description: Minimum number of libraries per project
          format: int32
          example: 2
        maxNumberOfLibraries:
          minimum: 1
          type: integer
          description: Maximum number of libraries per project
          format: int32
          example: 10
        threads:
          maximum: 8
          minimum: 1
          type: integer
          description: Number of threads for parallel processing (1-8)
          format: int32
          example: 8
        withUpdateRequest:
          type: boolean
          description: Whether to use update request for project creation
          example: true
    InternalGlobalAccountDTO:
      type: object
      properties:
        uuid:
          title: Account Uuid
          type: string
          example: 123e4567-e89b-12d3-a456-426655440000
        name:
          title: Account Name
          type: string
          example: Account A
        id:
          type: integer
          format: int32
        licenseKey:
          type: string
        creationTime:
          type: string
          format: date-time
    InternalTenantDTO:
      required:
      - name
      type: object
      properties:
        uuid:
          title: Context Uuid
          type: string
          example: 123e4567-e89b-12d3-a456-426655440000
        name:
          title: Context Name
          type: string
          example: Context A
        creationTime:
          type: string
          format: date-time
    SessionInfo:
      type: object
      properties:
        correlationId:
          type: string
        userUuid:
          type: string
        userName:
          type: string
        email:
          type: string
        refreshToken:
          type: string
        jwtToken:
          type: string
        orgName:
          title: Organization Name
          type: string
          example: Organization A
        orgUuid:
          title: Organization Uuid
          type: string
          example: 123e4567-e89b-12d3-a456-426655440000
    IntegrationDTOV3:
      type: object
      properties:
        uuid:
          type: string
        orgUuid:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
          - DELETED
        type:
          type: string
          enum:
          - JIRA
          - GITHUB
          - INVICTI
          - WIZ
        variant:
          type: string
          enum:
          - JIRA_CLOUD
          - JIRA_CLOUD_SECURITY
          - JIRA_DC
          - WIZ_COMMERCIAL
          - WIZ_GOV
          - WIZ_COMM_ON_GOV
          - WIZ_DEMO
        extraData:
          type: object
        createdBy:
          type: string
        creationDate:
          type: string
          format: date-time
        lastUpdate:
          type: string
          format: date-time
    StatisticsTypesDTO:
      type: object
      properties:
        statisticsTypes:
          type: array
          items:
            type: string
            enum:
            - alerts
            - licenseRisk
            - licenseHistogram
            - general
            - vulnerabilityEffectiveness
            - sourceLibraries
            - policyViolations
            - vulnerabilitySeverityLibraries
            - outdatedLibraries
            - policyViolatingLibraries
            - libraryTypeHistogram
            - approvalRequests
            - sastVulnerabilitiesBySeverity
            - sastVulnerabilitiesByType
            - sastScan
            - sastRiskFactors
            - unifiedVulnerabilities
            - scan
            - scans
            - scaSecurity
            - llmSecurity
            - imgSecurity
            - imgScanComplete
            - iacSecurity
            - imgUsage
            - dastSecurity
            - aiSecurity
            - workflowViolations
            - scaWorkflowViolations
            - sastWorkflowViolations
            - imgWorkflowViolations
            - aiWorkflowViolations
            - scaViolatingWorkflows
            - sastViolatingWorkflows
            - imgViolatingWorkflows
            - aiViolatingWorkflows
            - scaViolatingFindings
            - sastViolatingFindings
            - imgViolatingFindings
            - aiViolatingFindings
            - scaFrameworks
            - aiModels
            - scaExploitableVulnerabilities
            - scaMscFindings
            - imgMscFindings
            - aiRiskFactors
            - containerRiskFactors
            - scaCriticalSecurityEventFindings
            - contextRiskFactors
    DWRResponseMessageDTO:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
        retVal:
          $ref: '#/components/schemas/MessageDTO'
    MessageDTO:
      type: object
      properties:
        message:
          title: message
          type: string
          example: Success!
    InternalDomainSettingsDTO:
      type: object
      properties:
        active:
          type: boolean
        entitlements:
          type: array
          items:
            type: string
        tier:
          type: string
        mendForDevelopers:
          type: boolean
        sastNewGenerationEngines:
          type: array
          items:
            type: string
        sastTypeBasedIncrementalEngines:
          type: array
          items:
            type: string
        sastAiRemediation:
          type: boolean
        aiConsent:
          type: boolean
        systemPromptScanningEnabledDefault:
          type: boolean
        sastAiRemediationModel:
          type: string
        projectActivityFilterEnabled:
          type: boolean
        projectActivityFilterMonths:
          type: integer
          format: int32
        riskReductionTimeframeFilterValue:
          type: integer
          format: int32
        updateProjectTagsOnScaScan:
          type: boolean
        storeScanCommentAsTagEnabled:
          type: boolean
        storeScanCommentAsTagKey:
          type: string
        internalStatisticsEnabled:
          type: boolean
        includeProprietaryLibrariesInWorkflows:
          type: boolean
    DWRResponsePageableV3ListIntegrationDTOV3:
      type: object
      properties:
        additionalData:
          title: Provides insights into endpoint-supported pagination information.
          type: object
          description: '+ **totalItems**: The total count of data points returned in an API response.

            '
          example:
            totalItems: '422'
            next: http://someUrl?cursor=3
            cursor: 3
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
        response:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationDTOV3'
    InternalDomainDTO:
      type: object
      properties:
        uuid:
          title: Org Uuid
          type: string
          example: 123e4567-e89b-12d3-a456-426655440000
        name:
          title: Org Name
          type: string
          example: Organization A
        id:
          type: integer
          format: int32
        licenseKey:
          type: string
        creationTime:
          type: string
          format: date-time
        systemAccessEnabled:
          type: boolean
        active:
          type: boolean
        globalAccount:
          $ref: '#/components/schemas/InternalGlobalAccountDTO'
        tenant:
          $ref: '#/components/schemas/InternalTenantDTO'
    InternalQueueMessageDTO:
      type: object
      properties:
        queueName:
          type: string
        message:
          type: string
        envIdentifier:
          type: string
        routingKey:
          type: string
        sleepDelay:
          type: integer
          format: int32
    DWRResponseBase:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
  securitySchemes:
    bearer-key:
      type: http
      description: JWT token Bearer
      scheme: bearer
      bearerFormat: JWT
