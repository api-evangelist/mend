          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DWRResponseCollectionSourceLibraryResponseDTO'
components:
  schemas:
    SourceLibraryResponseDTO:
      type: object
      properties:
        uuid:
          type: string
          description: Unique identifier of the library. Only available in searchForMatch endpoint.
          example: b366b0ef-b211-4c37-a47c-0077e4de709f
        name:
          type: string
          description: Name of the library
          example: openssl
        sha1:
          type: string
          description: SHA-1 hash of the library
          example: 49f6cb968ff63793f6671d9026fb2a7034dad79a
        licenses:
          type: array
          description: Collection of licenses associated with this library
          items:
            $ref: '#/components/schemas/LiteLicenseDTO'
        version:
          type: string
          description: Version of the library
          example: OpenSSL_1_0_1
        owner:
          type: string
          description: Owner/organization of the library
          example: openssl
        url:
          type: string
          description: URL to the library source
          example: https://github.com/openssl/openssl.git
        date:
          type: string
          description: Release date of the library
          format: date-time
          example: '2012-03-14T12:39:00Z'
        nonOfficialRelease:
          type: boolean
          description: Indicates whether this is a non-official release
          example: false
        matchSuggestionId:
          type:
          - string
          - 'null'
          description: Base64 encoded match suggestion ID used for remapping operations.
          example: ZWJlMTZhZjYtMmE2YS00MWQ1LWFiNTQtYWQ3YWE3OWZhNzFl
      description: Library match suggestion response containing library details and match metadata
    LiteLicenseDTO:
      required:
      - name
      type: object
      properties:
        name:
          title: Licenses
          type: string
          example: MIT
        severity:
          title: License Risk
          type: string
          example: High
      description: Collection of licenses associated with this library
    ChangeOriginLibraryRequestDTO:
      type: object
      properties:
        productUuids:
          type: array
          items:
            type: string
        comment:
          type: string
        sourceFileUuids:
          type: array
          items:
            type: string
        sourceLibrary:
          $ref: '#/components/schemas/SourceLibraryDTO'
    DWRResponsePageableCollectionSourceFileInventoryDTO:
      type: object
      properties:
        additionalData:
          title: Provides insights into endpoint-supported pagination information.
          type: object
          description: '+ **totalItems**: The total count of data points returned in an API response.

            + **isLastPage**: Defines whether the current page represents the conclusion of the API response. When “true”, this signifies you are viewing the last page of the API response. When “false”, this indicates there are further pages remaining.'
          example:
            totalItems: '422'
            isLastPage: 'true'
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
        retVal:
          type: array
          items:
            $ref: '#/components/schemas/SourceFileInventoryDTO'
      description: Provides insights into endpoint-supported pagination information
    RequestResolutionDTO:
      type: object
      properties:
        uuids:
          type: array
          items:
            type: string
        name:
          type: string
        version:
          type: string
        url:
          type: string
    DWRResponseVoid:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
        retVal:
          type: object
    SourceLibraryDTO:
      type: object
      properties:
        uuid:
          type: string
        name:
          type: string
        sha1:
          type: string
        licenses:
          type: array
          items:
            type: string
        version:
          type: string
        owner:
          type: string
        url:
          type: string
        date:
          type: string
          format: date-time
        sourceLibraryMatchType:
          type: string
          enum:
          - INDEX
          - DB
    ProjectDTO:
      type: object
      properties:
        uuid:
          title: Project UUID
          type: string
          example: 123e4567-e89b-12d3-a456-426655440000
        name:
          title: Project Name
          type: string
          example: My Project
        path:
          title: Product Name
          type: string
          example: My Product
        productName:
          title: Product Name
          type: string
          example: My Product
        productUuid:
          title: Product Uuid
          type: string
          example: 123e4567-e89b-12d3-a456-426655440000
    MultiContextRequestDTO:
      type: object
      properties:
        projectIdentifiers:
          type: array
          items:
            title: Project Identifiers
            type: string
            example: 123e4567-e89b-12d3-a456-426655440000
        productIdentifiers:
          type: array
          items:
            title: Product Identifier
            type: string
            example: 123e4567-e89b-12d3-a456-426655440000
      description: If projectIdentifiers and productIdentifiers are empty, action will apply to the whole organization
    SourceFileLibraryDTO:
      type: object
      properties:
        uuid:
          title: Source Library UUID
          type: string
          example: 123e4567-e89b-12d3-a456-426655440000
        name:
          title: Source Library Name
          type: string
          example: ' actionview-v0.0.1'
        licenses:
          type: array
          items:
            $ref: '#/components/schemas/LicenseDTO'
        description:
          type: string
    LicenseDTO:
      required:
      - name
      type: object
      properties:
        uuid:
          title: License Uuid
          type: string
          example: 123e4567-e89b-12d3-a456-426655440000
        name:
          title: Licenses
          type: string
          example: MIT
        spdxName:
          title: Spdx Name
          type: string
          example: Glide
        type:
          title: Type
          type: string
          example: OPEN_SOURCE
        suspected:
          title: Suspected License
          type: boolean
        osiApproved:
          title: Approved Osi
          type: boolean
        profile:
          $ref: '#/components/schemas/LicenseProfileDTO'
    DWRResponseCollectionSourceLibraryResponseDTO:
      type: object
      properties:
        supportToken:
          title: Support Token
