openapi: 3.2.0
info:
  title: Mend Project Hierarchy Controller API
  description: 'Mend''s enhanced SCA API enables automation of workflows in a REST compliant format. The API features:

    + Access for any user with Mend credentials, via a user key available in the user''s profile page in the Mend App.

    + Improved security with a JWT token per organization, which expires every 10 minutes.

    + Added scalability with support for pagination, filtering and sorting search results.

    + Broader functionality available programmatically.

    + New standard API documentation for easy navigation and search.


    **Note:** To help you get started with the Mend SCA API 2.0, we recommend reviewing our onboarding guide -> Getting Started with Mend SCA API 2.0.

    This resource covers initial setup, authentication instructions, and helpful tips to help you successfully begin working with the Mend SCA API 2.0. If you have a dedicated instance of Mend, contact your Mend representative to access this API on your instance.'
  version: 3.0.1
servers:
- url: https://api-saas.mend.io
  description: Generated server url
security:
- bearer-key: []
tags:
- name: project-hierarchy-controller
paths:
  /api/v2.0/projects/{projectIdentifier}/hierarchy/rootLibrary/{rootLibraryUuid}/rootNodeId/{rootNodeId}:
    get:
      tags:
      - project-hierarchy-controller
      summary: Get Root Library Hierarchy
      description: Returns a hierarchy of a root Library in a project
      operationId: getRootHierarchyWithNodeId
      parameters:
      - name: projectIdentifier
        in: path
        description: 'project UUID (by running Entities - Product > Get Product Projects) or Project Token (from the Mend SCA App: **Integrate** tab > **Project Token**).'
        required: true
        schema:
          type: string
      - name: rootLibraryUuid
        in: path
        description: library UUID (get a project's library by running Library - Project > Get Project Libraries.
        required: true
        schema:
          type: string
      - name: rootNodeId
        in: path
        description: Root Node ID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LibraryHierarchyNodeDTO'
  /api/v2.0/projects/{projectIdentifier}/hierarchy/rootLibrary/{rootLibraryUuid}:
    get:
      tags:
      - project-hierarchy-controller
      summary: Get Root Library Hierarchy
      description: Returns a hierarchy of a root Library in a project
      operationId: getRootHierarchy
      parameters:
      - name: projectIdentifier
        in: path
        description: 'project UUID (by running Entities - Product > Get Product Projects) or Project Token (from the Mend SCA App: **Integrate** tab > **Project Token**).'
        required: true
        schema:
          type: string
      - name: rootLibraryUuid
        in: path
        description: library UUID (get a project's library by running Library - Project > Get Project Libraries.
        required: true
        schema:
          type: string
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LibraryHierarchyNodeDTO'
  /api/v2.0/projects/{projectIdentifier}/hierarchy/info:
    get:
      tags:
      - project-hierarchy-controller
      summary: Get Project Hierarchy Info
      description: Returns project hierarchy info
      operationId: getProjectHierarchyInfo
      parameters:
      - name: projectIdentifier
        in: path
        description: 'project UUID (by running Entities - Product > Get Product Projects) or Project Token (from the Mend SCA App: **Integrate** tab > **Project Token**).'
        required: true
        schema:
          type: string
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectHierarchyInfoDTO'
  /api/v2.0/projects/{projectIdentifier}/hierarchy:
    get:
      tags:
      - project-hierarchy-controller
      summary: Get Library Hierarchy
      description: Returns a hierarchy of the libraries in a project
      operationId: getHierarchy
      parameters:
      - name: projectIdentifier
        in: path
        description: 'project UUID (by running Entities - Product > Get Product Projects) or Project Token (from the Mend SCA App: **Integrate** tab > **Project Token**).'
        required: true
        schema:
          type: string
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LibraryHierarchyNodeDTO'
components:
  schemas:
    ProjectHierarchyInfoDTO:
      type: object
      properties:
        directDependenciesOnly:
          type: boolean
    LibraryHierarchyNodeDTO:
      type: object
      properties:
        uuid:
          title: Library UUID
          type: string
          example: 123e4567-e89b-12d3-a456-426655440000
        name:
          title: Library Name
          type: string
          example: dbus-1.10.24-13.el7_6.x86_64.rpm
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/LibraryHierarchyNodeDTO'
    DWRResponseBase:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
  securitySchemes:
    bearer-key:
      type: http
      description: JWT token Bearer
      scheme: bearer
      bearerFormat: JWT
