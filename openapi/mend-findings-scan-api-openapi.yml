        url:
          type: string
      type: object
    dto.SansTop25Info:
      properties:
        rank:
          type: integer
        title:
          type: string
      type: object
    dto.DataFlow:
      properties:
        ageRating:
          description: Between 0 and 10
          type: number
        confidenceRating:
          description: Between 0 and 10
          type: number
        createdTime:
          type: string
        filter:
          $ref: '#/components/schemas/dto.Filter'
        functionCalls:
          items:
            $ref: '#/components/schemas/dto.CallStackItem'
          type: array
        id:
          type: string
        inputFlow:
          items:
            $ref: '#/components/schemas/dto.CallStackItem'
          type: array
        inputKind:
          type: string
        inputSource:
          type: string
        isNew:
          type: boolean
        rating:
          description: Between 0 and 10
          type: number
        sink:
          type: string
        sinkFile:
          type: string
        sinkKind:
          type: string
        sinkLine:
          type: integer
        sinkSnippet:
          type: string
      type: object
    dto.OwaspInfo:
      properties:
        index:
          type: string
        title:
          type: string
        url:
          type: string
      type: object
    dto.RiskFactorEndpoint:
      properties:
        endpoint:
          type: string
        method:
          type: string
      type: object
    model.SecurityFindingExternal:
      type: object
      properties:
        createdAt:
          type: string
          example: '2019-12-18 16:15:26.963000'
        cvss:
          type: number
          example: 6.5
        cvssDetails:
          type: string
          example: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H
        description:
          type: string
          example: A vulnerability in the foo subsystem of bar could allow an unauthenticated, remote attacker to cause a denial of service (DoS) condition on an affected device.
        detectionDate:
          type: string
          example: '2019-12-18 16:15:26.963000'
        epss:
          type: number
          example: 5.1
        fixVersion:
          type: string
          example: 1.2.4
        hasFix:
          type: boolean
          example: true
        imageName:
          type: string
          example: foo:1.2.3
        lastModifiedDate:
          type: string
          example: '2019-12-18 16:15:26.963000'
        packageName:
          type: string
          example: foo
        packageVersion:
          type: string
          example: 1.2.3
        projectUUID:
          type: string
          example: edcd08f7-0688-4a30-932b-541256072846
        publishedDate:
          type: string
        reachabilityConfidence:
          type: number
        reachabilityGraph:
          type: string
        reachabilityStatus:
          type: string
        severity:
          type: string
          example: HIGH
        uuid:
          type: string
          example: edcd08f7-0688-4a30-932b-541256072846
        vulnerabilityID:
          type: string
          example: CVE-2019-1234
    common.Paging:
      type: object
      properties:
        cursor:
          type: integer
          example: 5
        next:
          type: string
          example: https://api-saas.mend.io/api/v3.0/projects/<project_uuid>>/images/deployments?cursor=6
    dto.FindingSharedStep:
      properties:
        endLine:
          type: integer
        file:
          type: string
        kind:
          type: string
        line:
          type: integer
        lineBlame:
          $ref: '#/components/schemas/dto.LineBlame'
        name:
          type: string
        snippet:
          type: string
        startLine:
          type: integer
      type: object
    github_com_mend_cloud-native_modules_scanner_model.SecretFinding:
