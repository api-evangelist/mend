        isFromBaseLayer:
          type: integer
          example: 0
        layerId:
          type: integer
          example: 123456
        layerNumber:
          type: integer
          example: 1
        projectName:
          type: string
        ruleId:
          type: string
          example: '123456'
        severity:
          type: string
          example: HIGH
        startLine:
          type: integer
          example: 15
        updatedAt:
          type: string
          example: '2020-01-01T00:00:00Z'
        uuid:
          type: string
          example: c4f93b6d-8236-4d0c-a67b-3978def476a3
    dto.HitrustInfo:
      properties:
        control:
          type: string
        title:
          type: string
      type: object
    dto.Filter:
      properties:
        filterTypes:
          items:
            $ref: '#/components/schemas/dto.FilterType'
          type: array
        isFiltered:
          type: boolean
      type: object
    github_com_mend_cloud-native_modules_scanner_model.Package:
      type: object
      properties:
        name:
          type: string
