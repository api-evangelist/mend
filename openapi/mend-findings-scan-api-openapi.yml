        issueKey:
          type: string
        issueStatus:
          type: string
        publicLink:
          type: string
      type: object
    dto.CweInfo:
      properties:
        id:
          type: string
        title:
          type: string
        url:
          type: string
      type: object
    dto.MendErrorResponse-dto_ErrorResponse:
