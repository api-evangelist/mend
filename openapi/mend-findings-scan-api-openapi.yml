        supportToken:
          type: string
          example: 659C0A4730
    dto.MendResponse-dto_FindingV3:
      properties:
        additionalData:
          additionalProperties: true
          type: object
        response:
          $ref: '#/components/schemas/dto.FindingV3'
        supportToken:
          type: string
      type: object
    dto.Workflow:
      properties:
        name:
          type: string
        uuid:
          type: string
      type: object
    dto.CapecInfo:
      properties:
        id:
          type: string
        title:
          type: string
        url:
          type: string
