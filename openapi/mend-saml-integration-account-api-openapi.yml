components:
  schemas:
    SAMLSettingDTO:
      type: object
      properties:
        id:
          type: string
        isActive:
          type: boolean
        metadataType:
          type: string
          enum:
          - URL
          - XML
          - FILE
        entityID:
          type: string
        replyUrl:
          type: string
        idpDomains:
          type: array
          items:
            type: string
        metadataLink:
          type: string
        allAttributeKeys:
          type: object
          additionalProperties:
            type: string
        roleGroupsMapping:
          type: array
          items:
            $ref: '#/components/schemas/SamlRoleGroupsMappingDTO'
        expiresAt:
          type: string
          format: date-time
        enableIdpInitiatedLogin:
          type: boolean
        enforceSsoOnLogin:
          type: boolean
        justInTimeProvisioning:
          type: boolean
        signingPreview:
          $ref: '#/components/schemas/SamlSigningPreview'
    DWRResponseV3MapSamlAttributeKeyTypeString:
      type: object
      properties:
        additionalData:
          type: object
          additionalProperties:
            type: object
        supportToken:
          type: string
        response:
          type: object
          additionalProperties:
            type: string
    DWRResponseBase:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
    DWRResponseV3String:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
        response:
          type: string
    SAMLSettingsRequestDTO:
      type: object
      properties:
        metadataType:
          type: string
          enum:
          - URL
          - XML
          - FILE
        metadataLink:
          type: string
        metadataInfo:
          type: string
        idpDomains:
          type: array
          items:
            type: string
        allAttributeKeys:
          type: object
          additionalProperties:
            type: string
        roleGroupsMapping:
          type: array
          items:
            $ref: '#/components/schemas/SamlRoleGroupsMappingDTO'
        enableIdpInitiatedLogin:
          type: boolean
        enforceSsoOnLogin:
          type: boolean
        justInTimeProvisioning:
          type: boolean
    DWRResponseV3SAMLSettingDTO:
      type: object
      properties:
        additionalData:
          type: object
          additionalProperties:
            type: object
        supportToken:
          type: string
        response:
          $ref: '#/components/schemas/SAMLSettingDTO'
    SamlSigningPreview:
      type: object
      properties:
        subject:
          type: object
          additionalProperties:
            type: string
        thumbprint:
          type: string
    GroupInfoDTO:
      required:
      - uuid
      type: object
      properties:
        uuid:
          title: Group Uuid
          type: string
          example: 123e4567-e89b-12d3-a456-426655440000
        name:
          title: Group Name
          type: string
          example: Group A
        description:
          title: Group Description
          type: string
          example: A description for a group
        domainUUID:
          title: Domain Uuid
          type: string
          example: 123e4567-e89b-12d3-a456-426655440000
        domainName:
          title: Domain Name
          type: string
          example: Domain A
        globalAccountUUID:
          title: Global Account Uuid
          type: string
          example: 123e4567-e89b-12d3-a456-426655440000
        userUUIDs:
          uniqueItems: true
          type: array
          items:
            title: User Uuid
            type: string
            example: 123e4567-e89b-12d3-a456-426655440000
    DWRResponseV3CollectionSamlRoleGroupsMappingDTO:
      type: object
      properties:
        additionalData:
          type: object
          additionalProperties:
            type: object
        supportToken:
          type: string
        response:
          type: array
          items:
            $ref: '#/components/schemas/SamlRoleGroupsMappingDTO'
    SamlRoleGroupsMappingDTO:
      type: object
      properties:
        roleName:
          type: string
        roleGroups:
          type: array
          items:
            $ref: '#/components/schemas/GroupInfoDTO'
  securitySchemes:
    bearer-key:
      type: http
      description: JWT token Bearer
      scheme: bearer
      bearerFormat: JWT
