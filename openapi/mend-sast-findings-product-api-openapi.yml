        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string
  /api/v2.0/sast/products/{productIdentifier}/findings/bulk/issues:
    post:
      tags:
      - SAST Findings - Product
      summary: Issue Bulk Action for Product findings
      description: Submits the issue in bulk for Product findings
      operationId: applyProductBulkFindingsIssue
      parameters:
      - name: productIdentifier
        in: path
        description: 'product UUID (by running Entities - Organization > Get Organization Products) or Product Token (from the Mend SCA App: **Integrate** tab > **Product Token**).'
