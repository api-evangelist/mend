          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiSastGroupedFindingDTO'
    post:
      tags:
      - SAST Findings - Product
      summary: Get Product SAST SSRM results
      description: This API request returns all the SAST SSRM results associated with the product
      operationId: getProductSastResultsSSRM
      parameters:
      - name: productIdentifier
        in: path
        description: 'product UUID (by running Entities - Organization > Get Organization Products) or Product Token (from the Mend SCA App: **Integrate** tab > **Product Token**).'
        required: true
        schema:
          type: string
      - name: labels
        in: query
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SSRMRequestDTO'
        required: true
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSastFindingsSSRMDTO'
  /api/v2.0/sast/products/{productIdentifier}/findings/export:
    post:
