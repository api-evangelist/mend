  /api/v2.0/sast/products/{productIdentifier}/findings/bulk/comments:
    post:
      tags:
      - SAST Findings - Product
      summary: Comment Bulk Action for Product findings
      description: Send Comments Action in bulk for Product findings
      operationId: applyBulkProductFindingsComments
      parameters:
      - name: productIdentifier
        in: path
        description: 'product UUID (by running Entities - Organization > Get Organization Products) or Product Token (from the Mend SCA App: **Integrate** tab > **Product Token**).'
