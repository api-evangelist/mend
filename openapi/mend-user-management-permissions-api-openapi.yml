openapi: 3.2.0
info:
  title: Mend User Management - Permissions API
  description: 'Mend''s enhanced SCA API enables automation of workflows in a REST compliant format. The API features:

    + Access for any user with Mend credentials, via a user key available in the user''s profile page in the Mend App.

    + Improved security with a JWT token per organization, which expires every 10 minutes.

    + Added scalability with support for pagination, filtering and sorting search results.

    + Broader functionality available programmatically.

    + New standard API documentation for easy navigation and search.


    **Note:** To help you get started with the Mend SCA API 2.0, we recommend reviewing our onboarding guide -> Getting Started with Mend SCA API 2.0.

    This resource covers initial setup, authentication instructions, and helpful tips to help you successfully begin working with the Mend SCA API 2.0. If you have a dedicated instance of Mend, contact your Mend representative to access this API on your instance.'
  version: 3.0.1
servers:
- url: https://api-saas.mend.io
  description: Generated server url
security:
- bearer-key: []
tags:
- name: User Management - Permissions
paths:
  /api/v3.0/orgs/{orgUuid}/permissions/scopes/search:
    post:
      tags:
      - User Management - Permissions
      summary: Get Permission Scopes
      description: For each permission, returns which scope levels (organization/application/account) the user has it at. Optionally filter by specific entity UUIDs to get which are permitted.
      operationId: getPermissionsByScope
      parameters:
      - name: orgUuid
        in: path
        description: Org UUID (Administration > General)
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionsByScopeRequestDTO'
        required: true
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DWRResponseV3PermissionsByScopeResponseDTO'
  /api/v3.0/orgs/{orgUuid}/permissions:
    get:
      tags:
      - User Management - Permissions
      summary: Get User Organization Permissions
      description: This api returns a list of permitted actions for the logged-in user and the given organization
      operationId: getUserPermissions
      parameters:
      - name: orgUuid
        in: path
        description: Org UUID (Administration > General)
        required: true
        schema:
          type: string
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DWRResponseV3UserPermissionListDTO'
  /api/v3.0/accounts/{accountUuid}/permissions:
    get:
      tags:
      - User Management - Permissions
      summary: Get User Account Permissions
      description: This api returns a list of permitted actions for the logged-in user and the given account
      operationId: getUserPermissions_1
      parameters:
      - name: accountUuid
        in: path
        description: Account UUID
        required: true
        schema:
          type: string
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DWRResponseBase'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DWRResponseV3UserPermissionListDTO'
components:
  schemas:
    PermissionsByScopeRequestDTO:
      type: object
      properties:
        permissions:
          type: array
          description: Permission names to query. Leave empty to return all permissions.
          example:
          - AUTOMATION__WORKFLOW__VIEW
          - AUTOMATION__WORKFLOW__UPDATE
          items:
            type: string
            description: Permission names to query. Leave empty to return all permissions.
            example: '["AUTOMATION__WORKFLOW__VIEW","AUTOMATION__WORKFLOW__UPDATE"]'
        scopes:
          type: object
          additionalProperties:
            type: array
            description: 'Optional filter: map of scope type to entity UUIDs to check permission for.'
            example:
              application:
              - f3b253a1-5056-4d37-821a-7daf16ae53ed
            items:
              type: string
              description: 'Optional filter: map of scope type to entity UUIDs to check permission for.'
              example: '{"application":["f3b253a1-5056-4d37-821a-7daf16ae53ed"]}'
          description: 'Optional filter: map of scope type to entity UUIDs to check permission for.'
          example:
            application:
            - f3b253a1-5056-4d37-821a-7daf16ae53ed
    DWRResponseV3UserPermissionListDTO:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
        response:
          $ref: '#/components/schemas/UserPermissionListDTO'
    UserPermissionListDTO:
      type: object
      properties:
        permissions:
          type: array
          items:
            title: User Permissions
            type: string
            example: POLICIES__POLICY__VIEW
    DWRResponseV3PermissionsByScopeResponseDTO:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
        response:
          $ref: '#/components/schemas/PermissionsByScopeResponseDTO'
    PermissionByScopeDTO:
      type: object
      properties:
        organizationLevel:
          type: boolean
        applicationLevel:
          type: boolean
        accountLevel:
          type: boolean
        permitted:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    PermissionsByScopeResponseDTO:
      type: object
      properties:
        permissionsByScope:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PermissionByScopeDTO'
    DWRResponseBase:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
  securitySchemes:
    bearer-key:
      type: http
      description: JWT token Bearer
      scheme: bearer
      bearerFormat: JWT
