      summary: Export Unified Findings report for a project asynchronously (Platform)
      operationId: exportUnifiedFindingsReport
      parameters:
      - name: projectUuid
        in: path
        description: Project UUID (Administration > Projects)
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUnifiedFindingsReportDTO'
        required: true
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
