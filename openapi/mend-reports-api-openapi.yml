components:
  schemas:
    CreateProjectSbomReportDTOReport:
      type: object
      properties:
        name:
          type: string
        format:
          type: string
          enum:
          - json
          - html
          - unknown
          - xml
          - excel
          - yaml
          - pdf
          - tv
          - rdf
          - csv
          - sarif
          - text
        sendEmailNotification:
          type: boolean
        labelsUuidList:
          type: array
          items:
            type: string
        excludeInactiveProjects:
          type: boolean
        reportType:
          type: string
          enum:
          - attribution
          - inventory
          - vulnerabilities
          - securityAlerts
          - sbom
          - Cbom
          - securityAlertsLibrary
          - Compliance
          - Findings
          - Suppressions
          - Resolved
          - spdx
          - spdx_2_3
          - cycloneDX
          - cycloneDX_1_5
          - cycloneDX_1_6
          - dueDiligence
          - unknown
          - imgAttribution
          - imgDueDiligence
          - imgSpdx
          - imgSpdx_2_3
          - imgCycloneDX
          - imgCycloneDX_1_5
          - aiInventory
          - aiFindings
          - imgCycloneDX_1_6
          - risk
          - users
          - zeroDayCatalog
          - activityLog
        maxDepthLevel:
          type: integer
          format: int32
        includeVulnerabilities:
          type: boolean
        isMlBomReport:
          type: boolean
          example: false
    AttributionReportExportProjectDTOV3:
      type: object
      properties:
        name:
          type: string
        format:
          type: string
          description: Output file format. The Attribution report supports json, html and text.
          example: json
          enum:
          - json
          - html
          - text
        sendEmailNotification:
          type: boolean
        licenses:
          type: array
          items:
            type: string
        primaryAttribute:
          type: string
        library:
          type: string
        groupBy:
          type: string
        header:
          type: string
        title:
          type: string
        footer:
          type: string
        licenseReference:
          type: string
        licenseTextPlacement:
          type: string
        selectedColumns:
          type: array
          items:
            type: string
        customAttribute:
          type: string
        includeSummary:
          type: boolean
        includeVersion:
          type: boolean
        hideEmptyFields:
          type: boolean
        groupByOrDefault:
          type: string
        licenseReferenceOrDefault:
          type: string
        licenseTextPlacementOrDefault:
          type: string
        selectedColumnsOrDefaultString:
          type: string
    InventoryReportExportProjectDTOV3:
      type: object
      properties:
        name:
          type: string
        format:
          type: string
          description: Output file format. The Inventory report supports excel, json and xml.
          example: excel
          enum:
          - excel
          - json
          - xml
        sendEmailNotification:
          type: boolean
    CreateUsersReportDTO:
      type: object
      properties:
        name:
          type: string
        format:
          type: string
          enum:
          - json
          - html
          - unknown
          - xml
          - excel
          - yaml
          - pdf
          - tv
          - rdf
          - csv
          - sarif
          - cbom
          - text
        sendEmailNotification:
          type: boolean
    RiskReportExportDTOV3:
      type: object
      properties:
        name:
          type: string
        format:
          type: string
          description: Output file format. The Risk report only supports pdf.
          example: pdf
          enum:
          - pdf
        sendEmailNotification:
          type: boolean
        projectUuids:
          type: array
          items:
            type: string
        exportMode:
          type: string
          description: Export mode. "split" (default) produces a ZIP (PDF summary + Excel CVE detail). "fullPdf" produces a single PDF, subject to a project-count threshold.
          example: split
          enum:
          - split
          - fullPdf
    FindingsReportExportProjectDTOV3:
      type: object
      properties:
        name:
          type: string
        format:
          type: string
          description: Output file format. The Findings report supports excel, json and xml.
          example: excel
          enum:
          - excel
          - json
          - xml
        sendEmailNotification:
          type: boolean
        vulnerabilitiesState:
          type: array
          description: Alert states to include. Defaults to [OPEN] when omitted.
          example:
          - OPEN
          items:
            type: string
            description: Alert states to include. Defaults to [OPEN] when omitted.
            example: '["OPEN"]'
            enum:
            - OPEN
            - IGNORE
        vulnerabilityTypes:
          type: array
          description: Filter by one or more vulnerability types. ANY (default) includes all types.
          example:
          - CVE
          - GHSA
          items:
            type: string
            description: Filter by one or more vulnerability types. ANY (default) includes all types.
            example: '["CVE","GHSA"]'
            enum:
            - MSC
            - CVE
            - ANY
            - GHSA
            - WS
            - MAI
