components:
  schemas:
    RemediationSnapshotDTO:
      type: object
      properties:
        date:
          type: string
        remediationReason:
          type: string
        backlog:
          type: boolean
        count:
          type: integer
          format: int32
    DWRResponseV3AverageTimeToRemediateDTO:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
        response:
          $ref: '#/components/schemas/AverageTimeToRemediateDTO'
    RemediationCountDTO:
      type: object
      properties:
        date:
          type: string
        remediationReason:
          type: string
        count:
          type: integer
          format: int64
    DWRResponseV3ListRemediationSnapshotDTO:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
        response:
          type: array
          items:
            $ref: '#/components/schemas/RemediationSnapshotDTO'
    RemediationDurationBucketDTO:
      type: object
      properties:
        date:
          type: string
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/RemediationDurationDateBucketDTO'
    RemediationSeverityCountDTO:
      type: object
      properties:
        date:
          type: string
        remediationReason:
          type: string
        severity:
          type: string
        count:
          type: integer
          format: int64
    RemediationDurationDateBucketDTO:
      type: object
      properties:
        bucket:
          type: string
        count:
          type: integer
          format: int64
    DWRResponseV3ListRemediationDurationBucketDTO:
