      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
        response:
          type: array
          items:
            $ref: '#/components/schemas/RemediationDurationBucketDTO'
    DWRResponseV3ListRemediationSeverityCountDTO:
