      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
        response:
          type: array
          items:
            $ref: '#/components/schemas/RemediationSeverityCountDTO'
    AverageTimeToRemediateDTO:
      type: object
      properties:
        count:
          type: integer
          format: int32
        avgOpenDuration:
          type: integer
          format: int64
    DWRResponseBase:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
    DWRResponseV3ListRemediationCountDTO:
      type: object
      properties:
        supportToken:
          title: Support Token
          type: string
          example: 1171c60d
        response:
          type: array
          items:
            $ref: '#/components/schemas/RemediationCountDTO'
  securitySchemes:
    bearer-key:
