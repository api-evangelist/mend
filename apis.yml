aid: mend
name: Mend
description: Mend.io (formerly WhiteSource) is a unified application security and AI security platform that helps engineering and security teams
  find and automatically remediate vulnerabilities across open-source dependencies, proprietary code, containers, and AI models/agents. Its products
  span Software Composition Analysis (SCA), Static Application Security Testing (SAST), container image scanning, SBOM generation, automated dependency
  updates (Renovate), and AI-native security for LLM-powered applications. Mend exposes a REST-compliant AppSec Platform API (v3.0) and an SCA
  API (v2.0) for automating scans, projects, applications, findings, reports, and administration, secured with a short-lived per-organization
  JWT obtained from a user key.
